<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root {
    --bg: #000; --side: #000; --panel: #050505; --line: #262626; --line2: #3d3d3d; --hover: #141414;
    --tx: #e6e6e6; --mut: #8a8a8a; --dim: #555; --hi: #fff; --b: #6e6e6e;
    --fs: 13px; --fs-s: 12px; --fs-l: 30px; --fs-h: 34px;
    --serif: 'Yu Mincho', 'YuMincho', 'Hiragino Mincho ProN', 'Noto Serif JP', 'MS PMincho', serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--tx); font-family: 'Segoe UI', 'Hiragino Sans', Meiryo, sans-serif; font-size: var(--fs); -webkit-font-smoothing: antialiased; }
  .app { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
  nav { background: var(--side); padding: 22px 0; position: sticky; top: 0; height: 100vh; border-right: 1px solid #2a2a2a; }
  .brand { padding: 0 20px 18px; margin-bottom: 8px; border-bottom: 1px solid #fff; }
  .brand b { font-family: var(--serif); font-size: 17px; color: var(--hi); font-weight: 700; letter-spacing: .08em; white-space: nowrap; }
  .brand div { font-size: var(--fs-s); color: var(--mut); margin-top: 8px; font-variant-numeric: tabular-nums; letter-spacing: .04em; }
  .navlbl { font-size: 11px; color: var(--dim); padding: 12px 20px 6px; letter-spacing: .2em; }
  .nv { display: block; padding: 9px 20px; cursor: pointer; color: var(--mut); transition: background .15s, color .15s; font-family: var(--serif); font-size: 14px; letter-spacing: .06em; }
  .nv:hover { background: var(--hover); color: var(--hi); }
  .nv.on { background: #fff; color: #000; font-weight: 700; }
  .nv small { display: block; font-family: 'Segoe UI', Meiryo, sans-serif; font-size: 11px; color: var(--dim); margin-top: 2px; letter-spacing: 0; font-weight: normal; }
  .nv.on small { color: #444; }
  .navfoot { position: absolute; bottom: 18px; left: 16px; right: 16px; }
  .rld { display: block; width: 40px; height: 40px; padding: 0; border: 0; background: transparent; cursor: pointer; border-radius: 50%; transition: transform .3s; }
  .rld svg { display: block; overflow: visible; }
  .rld .rt { fill: none; stroke: #2a2a2a; stroke-width: 1.5; }
  .rld .ra { fill: none; stroke: #fff; stroke-width: 1.5; stroke-dasharray: 26 81; stroke-linecap: round; transform-origin: 20px 20px; filter: drop-shadow(0 0 3px #fff); transition: stroke-dasharray .4s; }
  .rld .rd { fill: #fff; filter: drop-shadow(0 0 4px #fff); animation: blink 1.6s ease-in-out infinite; }
  .rld:hover .ra { stroke-dasharray: 60 47; animation: rspin 1.4s linear infinite; }
  .rld.spin .ra { stroke-dasharray: 40 67; animation: rspin .7s linear infinite; }
  .rld.spin .rd { opacity: 0; animation: none; }
  @keyframes rspin { to { transform: rotate(360deg); } }
  .btn { background: transparent; border: 1px solid var(--line2); color: var(--mut); padding: 8px 10px; cursor: pointer; font-family: inherit; font-size: var(--fs-s); width: 100%; transition: all .15s; letter-spacing: .1em; }
  .btn:hover { background: #fff; color: #000; border-color: #fff; }
  main { padding: 40px 56px 80px; min-width: 0; max-width: 1500px; }
  .ph { margin-bottom: 26px; padding-bottom: 14px; border-bottom: 1px solid #fff; animation: fade .4s both; display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; }
  .ph h1 { font-family: var(--serif); font-size: var(--fs-h); font-weight: 700; color: var(--hi); margin: 0; letter-spacing: .14em; }
  .ph div { color: var(--mut); font-size: var(--fs); letter-spacing: .06em; }
  .card { background: var(--panel); border: 1px solid var(--line); padding: 18px 20px; margin-bottom: 16px; }
  .card.anim { animation: rise .4s cubic-bezier(.2,.8,.2,1) both; }
  .card h2 { font-family: var(--serif); font-size: 16px; margin: 0 0 14px; color: var(--hi); font-weight: 700; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; letter-spacing: .08em; }
  .card h2 small { font-family: 'Segoe UI', Meiryo, sans-serif; font-weight: normal; color: var(--mut); font-size: var(--fs-s); letter-spacing: 0; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .row > .card { flex: 1 1 400px; min-width: 0; }
  .ctl { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-bottom: 8px; }
  .lbl { font-size: var(--fs-s); color: var(--mut); margin-right: 4px; }
  .chip { border: 1px solid transparent; background: transparent; color: var(--mut); padding: 4px 10px; cursor: pointer; font-family: inherit; font-size: var(--fs-s); transition: background .15s, color .15s, border-color .15s; }
  .chip:hover { border-color: var(--line2); color: var(--hi); }
  .chip.on { background: #fff; color: #000; font-weight: 600; }
  .sep { width: 1px; height: 16px; background: var(--line2); margin: 0 8px; }
  .periods { display: flex; gap: 18px; font-size: var(--fs-s); margin: 10px 0 2px; flex-wrap: wrap; color: var(--tx); font-variant-numeric: tabular-nums; }
  .pa::before, .pb::before { content: ''; display: inline-block; width: 8px; height: 8px; margin-right: 6px; }
  .pa::before { background: var(--hi); }
  .pb::before { background: var(--b); }
  .hint { font-size: var(--fs-s); color: var(--mut); }
  .pbox { background: #000; border: 1px solid var(--line2); padding: 12px 14px; margin: 6px 0 12px; }
  .prow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .plbl { font-size: var(--fs-s); color: var(--mut); letter-spacing: .1em; }
  .dates { display: inline-flex; align-items: center; gap: 6px; }
  .sel { background: #000; border: 1px solid var(--line2); color: var(--hi); padding: 5px 8px; font-family: inherit; font-size: var(--fs); color-scheme: dark; cursor: pointer; border-radius: 0; }
  .sel:hover { border-color: #888; }
  .sel:focus { outline: none; border-color: #fff; }
  .periods b { color: var(--hi); font-weight: 700; }
  .periods .hint { margin-left: auto; }
  .card h2 > span { text-transform: uppercase; }
  .dwrap { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .dn .seg { transition: stroke-dasharray .9s cubic-bezier(.2,.8,.2,1); cursor: default; }
  .dn .seg:hover { filter: brightness(1.3); }
  svg .dnv { font-family: var(--serif); font-size: 26px; font-weight: 700; fill: #fff; }
  svg .dnl { font-size: 9px; letter-spacing: .18em; fill: var(--mut); }
  .dlg { display: grid; grid-template-columns: 10px minmax(80px, auto) auto auto; gap: 6px 10px; align-items: center; font-size: var(--fs-s); font-variant-numeric: tabular-nums; flex: 1; min-width: 180px; max-width: 380px; }
  .dlg > div { display: contents; }
  .dlg i { width: 10px; height: 10px; display: inline-block; }
  .dlg .nm { color: var(--tx); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dlg b { color: var(--hi); text-align: right; }
  .dlg em { font-style: normal; color: var(--mut); text-align: right; }
  .dpair { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
  .cwrap { display: flex; justify-content: center; margin-bottom: 10px; }
  .clk path { transform-origin: 140px 140px; animation: pop .6s cubic-bezier(.2,.8,.2,1) both; }
  .clk text { font-size: 10px; }
  .scroll-x { overflow-x: auto; }
  .cal .cc { animation: fade .5s both; }
  .cal text { font-size: 9px; letter-spacing: .1em; }
  .burn .bl { font-size: 10px; fill: var(--mut); letter-spacing: .05em; }
  .burn .bl.hi { fill: #fff; font-weight: 700; font-size: 11px; }
  .burn .pulse { animation: pulse 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  .mbar { position: relative; margin: 6px 0 14px; cursor: help; }
  .mtrack { position: relative; height: 7px; background-size: 100% 4px; background-repeat: repeat-x; background-position: 0 0; border-bottom: 1px solid #2a2a2a; }
  .mfill { position: absolute; left: 0; bottom: -1px; height: 2px; width: 0; background: #fff; box-shadow: 0 0 6px #fff, 0 0 14px rgba(255,255,255,.5); transition: width 1.2s cubic-bezier(.2,.8,.2,1); }
  .mfill::after { content: ''; position: absolute; right: -1px; top: -6px; width: 2px; height: 14px; background: #fff; box-shadow: 0 0 8px #fff, 0 0 18px #fff; animation: blink 1.6s ease-in-out infinite; }
  .mlab { display: flex; justify-content: space-between; margin-top: 8px; font-family: var(--serif); font-size: 12px; color: var(--mut); letter-spacing: .12em; }
  .mlab b { font-size: 20px; color: #fff; margin: 0 3px; font-weight: 700; text-shadow: 0 0 10px rgba(255,255,255,.45); }
  .half2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 4px; }
  .half2 > div { min-width: 0; border-top: 1px solid var(--line); }
  @media (max-width: 1000px) { .half2 { grid-template-columns: 1fr; } }
  .tlist { max-height: 340px; overflow: auto; }
  .tlh { display: flex; align-items: baseline; justify-content: space-between; font-family: var(--serif); font-size: 14px; color: var(--hi); letter-spacing: .14em; border-bottom: 1px solid #fff; padding: 4px 2px 6px; margin-top: 6px; }
  .tlh b { font-size: 20px; text-shadow: 0 0 10px rgba(255,255,255,.4); }
  .tlr { display: grid; grid-template-columns: 10px 48px 1fr auto; gap: 10px; align-items: center; padding: 8px 2px; border-bottom: 1px solid #1a1a1a; animation: slidein .45s cubic-bezier(.2,.8,.2,1) both; font-variant-numeric: tabular-nums; }
  .tlr:hover { background: #0e0e0e; }

  .tlr.new i { background: #fff; box-shadow: 0 0 8px #fff; animation: blink 1.4s ease-in-out infinite; }
  .tlr time { color: var(--mut); font-size: var(--fs-s); }
  .tlr span { font-family: var(--serif); font-size: 14px; color: #fff; letter-spacing: .06em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tlr em { font-style: normal; font-size: 11px; color: var(--mut); border: 1px solid #2a2a2a; padding: 1px 6px; }
  .tle { color: var(--dim); font-size: var(--fs-s); padding: 10px 2px 14px; letter-spacing: .2em; }
  @keyframes slidein { from { opacity: 0; transform: translateX(12px); } }
  .kswc .ksw { display: flex; gap: 2px; margin-top: 6px; }
  .kswc .ksw .chip { padding: 1px 7px; font-size: 11px; border: 1px solid #2a2a2a; }
  .kswc .ksw .chip.on { border-color: #fff; }
  .fbk { font-size: 13px; line-height: 1.9; color: var(--tx); border-left: 2px solid #fff; padding: 2px 0 2px 12px; margin: 4px 0 16px; box-shadow: -6px 0 12px -8px #fff; }
  .yb rect.b { fill: #3a3a3a; }
  .yb rect.b.ok, .yb rect.b.now { fill: #fff; }
  .yb rect.b.ok { filter: drop-shadow(0 0 5px rgba(255,255,255,.55)); }
  .yb rect.b.now { animation: grow .5s cubic-bezier(.2,.8,.2,1) both, nowg 1.8s ease-in-out .6s infinite; }
  .yb rect.b.fut { fill: #121212; stroke: #555; stroke-dasharray: 3 3; }
  .yb .pl { stroke: #b0b0b0; stroke-width: 2; animation: fade .4s both; }
  .yb .pc { font-size: 11px; fill: var(--mut); font-weight: 700; animation: fade .5s .4s both; }
  .yb .pc.ok { fill: #fff; }
  .yb .pc.fut { fill: #444; font-weight: normal; }
  .yb .nowl { fill: #fff; font-weight: 700; }
  .ysum { margin-left: auto; font-size: var(--fs-s); color: var(--mut); cursor: help; letter-spacing: .06em; }
  .ysum b { font-family: var(--serif); font-size: 18px; color: #fff; margin: 0 2px; }
  @keyframes nowg { 50% { opacity: .55; } }
  .tline { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; height: 70px; }
  .th { position: relative; border-bottom: 1px solid #333; }
  .th b, .th s { position: absolute; bottom: 0; display: block; transition: height .6s; }
  .th b { left: 20%; right: 20%; background: #fff; z-index: 1; }
  .th s { left: 0; right: 0; background: #262626; }
  .th span { position: absolute; bottom: -16px; left: 0; font-size: 9px; color: var(--mut); }
  .th.fut { opacity: .35; }
  .th em { position: absolute; top: -14px; left: 0; right: 0; text-align: center; font-style: normal; font-size: 10px; color: #fff; font-weight: 700; }
  .live .kpis { grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; }
  .live .kpi { padding: 9px 12px 6px; }

  .live .tline { height: 52px; margin-top: 18px; }
  .th.now { border-bottom: 2px solid #fff; }
  .tline { margin-bottom: 18px; }
  .rings { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 1100px) { .rings { grid-template-columns: repeat(2, 1fr); } }
  .rc { display: flex; flex-direction: column; align-items: center; border: 1px solid var(--line); border-top: 1px solid #fff; padding: 12px 10px 14px; }
  .rn { align-self: stretch; font-family: var(--serif); font-size: 16px; font-weight: 700; color: var(--hi); display: flex; align-items: center; justify-content: space-between; gap: 8px; letter-spacing: .1em; min-height: 26px; }
  .rn .mt { display: inline-flex; border: 1px solid var(--line2); }
  .rn .mt .chip { padding: 2px 9px; font-family: var(--serif); font-size: 13px; }
  .mk { font-style: normal; font-family: var(--serif); font-size: 22px; font-weight: 700; line-height: 1; }
  .mk.g3, .mk.g2 { color: #fff; text-shadow: 0 0 8px #fff, 0 0 16px rgba(255,255,255,.5); }
  .mk.g1, .mk.g0 { color: #777; }
  .mk.g3 { animation: blink 2.2s ease-in-out infinite; }
  .rv { font-variant-numeric: tabular-nums; margin-top: 2px; }
  .rv b { font-family: var(--serif); font-size: 22px; color: #fff; }
  .rv small { color: var(--mut); font-size: var(--fs-s); margin-left: 4px; }
  .tag { font-family: 'Segoe UI', Meiryo, sans-serif; font-style: normal; font-size: 10px; letter-spacing: .14em; border: 1px solid var(--line2); color: var(--mut); padding: 1px 6px; }
  .tag.ok { background: #fff; color: #000; border-color: #fff; font-weight: 700; }
  .rl { display: flex; justify-content: space-between; font-size: var(--fs-s); padding: 3px 0; border-bottom: 1px solid #161616; font-variant-numeric: tabular-nums; }
  .rl span { color: var(--mut); letter-spacing: .12em; font-size: 10px; }
  .rl b { color: var(--hi); }
  .rg .rgf { transition: stroke-dasharray 1.1s cubic-bezier(.2,.8,.2,1); }
  svg .rgv { font-family: var(--serif); font-size: 28px; font-weight: 700; fill: #fff; }
  svg .rgu { font-size: 12px; fill: var(--mut); }
  .pg { display: grid; grid-template-columns: minmax(110px, 30%) 1fr 70px 44px; gap: 9px 12px; align-items: center; font-size: var(--fs); font-variant-numeric: tabular-nums; }
  .pg .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pg .tr { position: relative; height: 10px; background: #141414; }
  .pg .pf { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #fff; transition: width .9s cubic-bezier(.2,.8,.2,1); }
  .pg .tr i { position: absolute; top: -4px; bottom: -4px; width: 1px; background: #8a8a8a; }
  .pg .va { text-align: right; color: var(--hi); } .pg .va small { color: var(--mut); }
  .pg .vb { text-align: right; color: var(--mut); font-size: var(--fs-s); }
  .qi { font-style: normal; display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; border: 1px solid #444; border-radius: 50%; font-size: 9px; color: var(--mut); font-family: 'Segoe UI', sans-serif; margin-left: 2px; cursor: help; vertical-align: middle; transition: all .2s; }
  .card h2[data-t] { cursor: help; }

  .kpi .t .qi { float: right; }
  .hint.q { cursor: help; border-bottom: 1px dotted #555; }
  .sub { font-size: var(--fs-s); color: var(--mut); margin: 14px 0 22px; cursor: help; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #fff; margin-right: 2px; animation: blink 1.6s ease-in-out infinite; box-shadow: 0 0 10px #fff; align-self: center; }
  .card h2 small.clock { font-family: var(--serif); font-size: 13px; color: var(--hi); letter-spacing: .08em; margin-left: auto; }
  .th.now { animation: nowb 1.6s ease-in-out infinite; }
  .rc { cursor: help; transition: background .25s, box-shadow .25s; position: relative; overflow: hidden; }
  .rc:hover { background: #0d0d0d; box-shadow: 0 0 0 1px #3a3a3a inset; }
  .rc::after { content: ''; position: absolute; top: -1px; left: -40%; width: 40%; height: 1px; background: linear-gradient(90deg, transparent, #fff, transparent); animation: scan 5s linear infinite; }
  .rc:nth-child(2)::after { animation-delay: .8s; } .rc:nth-child(3)::after { animation-delay: 1.6s; } .rc:nth-child(4)::after { animation-delay: 2.4s; } .rc:nth-child(5)::after { animation-delay: 3.2s; } .rc:nth-child(6)::after { animation-delay: 4s; } .rc:nth-child(7)::after { animation-delay: 4.6s; } .rc:nth-child(8)::after { animation-delay: 5.2s; }
  .rg .rgg { opacity: .55; }
  .rc.good .rg .rgg { animation: neon 2.6s ease-in-out 1.2s infinite; }
  @keyframes neon { 50% { opacity: 1; } }
  .burn .bc { filter: drop-shadow(0 0 3px #fff) drop-shadow(0 0 8px rgba(255,255,255,.5)); }
  .rg .tipd { opacity: 0; animation: fade .3s 1.1s forwards; }
  .rg .tipp { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pulse 1.8s 1.2s ease-out infinite; }
  .rc.good .tipp { animation-duration: 1.2s; }
  .pg .tr { cursor: help; overflow: visible; }
  .pg .pf { overflow: hidden; }
  .pg .pf::after { content: ''; position: absolute; top: 0; bottom: 0; width: 30px; left: -30px; background: linear-gradient(90deg, transparent, rgba(0,0,0,.35), transparent); animation: sweep 3.2s ease-in-out infinite; }
  .pg .tr.ok .pf { box-shadow: 0 0 8px rgba(255,255,255,.35); }
  .pg .tr i { animation: blink 2.4s ease-in-out infinite; }
  .brush .ants { animation: ants .8s linear infinite; }
  .cal .cc.today { animation: blink 1.4s ease-in-out infinite; stroke: #fff; }
  .clk .peak { animation: peak 1.6s ease-in-out infinite; transform-origin: 140px 140px; }
  .kpi { position: relative; overflow: hidden; }
  .kpi::before { content: ''; position: absolute; top: -1px; left: -50%; width: 50%; height: 1px; background: linear-gradient(90deg, transparent, #fff, transparent); animation: scan 1.2s ease-out .2s 1 both; }
  .kpi:hover { box-shadow: 0 0 0 1px #333 inset; }
  .card { transition: border-color .3s; }
  .card:hover { border-color: #353535; }

  @keyframes stripe { to { background-position: 12px 0; } }
  @keyframes sweep { 0% { left: -60px; } 60%, 100% { left: 100%; } }
  @keyframes scan { 0% { left: -50%; } 100% { left: 110%; } }
  @keyframes nowb { 50% { border-bottom-color: #555; } }
  @keyframes ants { to { stroke-dashoffset: -10; } }
  @keyframes peak { 50% { opacity: .45; } }

  @keyframes pulse { from { transform: scale(1); opacity: .9; } to { transform: scale(4); opacity: 0; } }
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .kpi { border: 1px solid var(--line); border-top: 1px solid #fff; padding: 12px 14px 14px; transition: background .15s; }
  .kpi:hover { background: #0e0e0e; }
  .kpi .t { font-size: var(--fs-s); color: var(--mut); letter-spacing: .04em; }
  .kpi .v { font-family: var(--serif); font-size: var(--fs-l); font-weight: 700; color: var(--hi); margin-top: 6px; font-variant-numeric: tabular-nums; display: flex; align-items: baseline; flex-wrap: wrap; }
  .kpi .v small { font-family: 'Segoe UI', Meiryo, sans-serif; font-size: var(--fs-s); font-weight: normal; color: var(--mut); margin-left: 4px; }
  .kpi .dl { font-family: 'Segoe UI', Meiryo, sans-serif; font-style: normal; font-size: 16px; font-weight: 700; margin-left: 12px; padding: 1px 7px; }

  .kpi .s { font-size: var(--fs-s); color: var(--mut); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .up { color: var(--hi); font-weight: 700; }
  .down { color: var(--mut); font-weight: 600; }

  th, td { border-bottom: 1px solid #1c1c1c; padding: 7px 10px; text-align: right; white-space: nowrap; }
  th { color: var(--mut); font-weight: normal; font-size: var(--fs-s); position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid #fff; }
  th:first-child, td:first-child { text-align: left; }

  tr.sel td { background: #fff; color: #000; }

  svg text { font-family: 'Segoe UI', Meiryo, sans-serif; fill: var(--mut); font-size: 10px; }

  var col = cols.filter(function (c) { return c[0] === UP.m; })[0];
  var labels = R.map(function (r) { return r[0]; }), vals = R.map(function (r) { return num(r[col[0]]); });
  var last = vals[vals.length - 1], prev = vals[vals.length - 2], yo = vals.length > 12 ? vals[vals.length - 13] : null;
  var dec = col[2] === '%' ? 1 : 0;
  var k = card('まとめ', labels[labels.length - 1] + ' 時点の数字。');
  kpis(k, kpi(col[1], last, col[2], dec, '前月 ' + fmt(prev, dec) + '　' + chg(last, prev)) +
    kpi('12ヶ月平均', vals.slice(-12).reduce(function (p, q) { return p + (q || 0); }, 0) / Math.min(12, vals.length), col[2], dec, '') +
    (yo != null ? kpi('前年', yo, col[2], dec, '前年比 ' + chg(last, yo)) : '') +
    kpi('件数', num(R[R.length - 1][1]), '件', 0, '') + kpi('回収率', num(R[R.length - 1][4]), '%', 1, ''));
  main.insertBefore(k, top.nextSibling);
  bars(g, labels, [{ name: col[1], color: function (i) { return i === labels.length - 1 ? FUT : A_C; }, lc: A_C, vals: vals }], { height: 240, fmt: function (v) { return col[2] === '円' ? fmt(v / 10000, 1) + '万' : fmt(v, dec) + (col[2] === '%' ? '%' : ''); } });
  var c2 = card('月別');
  var t = '<table><tr>' + [0, 1, 2, 3, 4, 6, 7, 8, 9, 10].map(function (i) { return '<th>' + esc(head[i]) + '</th>'; }).join('') + '</tr>';
  R.slice().reverse().forEach(function (r) { t += '<tr>' + [0, 1, 2, 3, 4, 6, 7, 8, 9, 10].map(function (i) { return '<td>' + esc(r[i]) + '</td>'; }).join('') + '</tr>'; });
  c2.appendChild(h('div', { class: 'scroll' }, t + '</table>'));
  main.appendChild(c2);
}

/* ---------- 画面の切り替え ---------- */
var RENDER = { jl: renderJl, visit: renderVisit, op: renderOp, hq: renderHq, master: renderMaster, member: renderMember, unpaid: renderUnpaid };
function drawItems() {
  var el = $('items'); el.innerHTML = '';
  ITEMS.forEach(function (it, i) {
    var d = h('div', { class: 'nv' + (CUR === it.id ? ' on' : '') }, it.name);
    d.onclick = function () { open(it.id); };
    el.appendChild(d);
  });
}
function render(id) {
  CARD_I = 0; FIRST = true; KEYNAV = null; RENDER[id]($('main')); FIRST = false;
}
function open(id, force) {
  CUR = id; drawItems();
  var it = ITEMS.filter(function (x) { return x.id === id; })[0];
  $('ttl').textContent = it.name;
  $('ttl').style.animation = 'none'; void $('ttl').offsetWidth; $('ttl').style.animation = '';
  try { if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id); } catch (e) {}
  var main = $('main');
  main.innerHTML = '<div class="loading full">読み込み中</div>';
  var rb = $('reload'); if (force) rb.classList.add('spin');
  load(id, force).then(function (d) {
    rb.classList.remove('spin');
    if (CUR !== id) return;
    $('at').textContent = String(d.at || '').replace(/^\d{4}\/(\d+)\/(\d+)/, function (m, a, b) { return +a + '/' + +b; });
    [JL, VS, OP, MB].forEach(function (s) { s.anim = true; });
    render(id);
  }, function (err) { rb.classList.remove('spin'); main.innerHTML = '<div class="loading err">読み込めませんでした　' + esc((err && err.message) || err) + '</div>'; });
}
$('reload').onclick = function () { if (CUR) open(CUR, true); };
var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { if (CUR && DATA[CUR]) render(CUR); }, 200); });
document.addEventListener('keydown', function (e) {
  if (!KEYNAV || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') || e.altKey || e.ctrlKey || e.metaKey) return;
  var tg = (e.target && e.target.tagName) || '';
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(tg)) return;
  e.preventDefault();
  KEYNAV(e.key === 'ArrowRight' ? 1 : -1);
});
window.addEventListener('hashchange', function () { var id = location.hash.slice(1); if (RENDER[id] && id !== CUR) open(id); });
drawItems();
var start = (location.hash || '').slice(1);
open(RENDER[start] ? start : 'master');
</script>
</body>
