<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root {
    --bg: #000; --side: #000; --panel: #050505; --line: #262626; --line2: #3d3d3d; --hover: #141414;
    --tx: #e6e6e6; --mut: #8a8a8a; --dim: #555; --hi: #fff; --b: #6e6e6e;
    --fs: 13px; --fs-s: 12px; --fs-l: 30px; --fs-h: 34px;
    --serif: 'Yu Mincho', 'YuMincho', 'Hiragino Mincho ProN', 'Noto Serif JP', 'MS PMincho', serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--tx); font-family: 'Segoe UI', 'Hiragino Sans', Meiryo, sans-serif; font-size: var(--fs); -webkit-font-smoothing: antialiased; }
  .app { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
  nav { background: var(--side); padding: 22px 0; position: sticky; top: 0; height: 100vh; border-right: 1px solid #2a2a2a; }
  .brand { padding: 0 20px 18px; margin-bottom: 8px; border-bottom: 1px solid #fff; }
  .brand b { font-family: var(--serif); font-size: 17px; color: var(--hi); font-weight: 700; letter-spacing: .08em; white-space: nowrap; }
  .brand div { font-size: var(--fs-s); color: var(--mut); margin-top: 8px; font-variant-numeric: tabular-nums; letter-spacing: .04em; }
  .navlbl { font-size: 11px; color: var(--dim); padding: 12px 20px 6px; letter-spacing: .2em; }
  .nv { display: block; padding: 9px 20px; cursor: pointer; color: var(--mut); transition: background .15s, color .15s; font-family: var(--serif); font-size: 14px; letter-spacing: .06em; }
  .nv:hover { background: var(--hover); color: var(--hi); }
  .nv.on { background: #fff; color: #000; font-weight: 700; }
  .nv small { display: block; font-family: 'Segoe UI', Meiryo, sans-serif; font-size: 11px; color: var(--dim); margin-top: 2px; letter-spacing: 0; font-weight: normal; }
  .nv.on small { color: #444; }
  .navfoot { position: absolute; bottom: 18px; left: 16px; right: 16px; }
  .btn { background: transparent; border: 1px solid var(--line2); color: var(--mut); padding: 8px 10px; cursor: pointer; font-family: inherit; font-size: var(--fs-s); width: 100%; transition: all .15s; letter-spacing: .1em; }
  .btn:hover { background: #fff; color: #000; border-color: #fff; }
  main { padding: 40px 56px 80px; min-width: 0; max-width: 1500px; }
  .ph { margin-bottom: 26px; padding-bottom: 14px; border-bottom: 1px solid #fff; animation: fade .4s both; display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; }
  .ph h1 { font-family: var(--serif); font-size: var(--fs-h); font-weight: 700; color: var(--hi); margin: 0; letter-spacing: .14em; }
  .ph div { color: var(--mut); font-size: var(--fs); letter-spacing: .06em; }
  .card { background: var(--panel); border: 1px solid var(--line); padding: 18px 20px; margin-bottom: 16px; }
  .card.anim { animation: rise .4s cubic-bezier(.2,.8,.2,1) both; }
  .card h2 { font-family: var(--serif); font-size: 16px; margin: 0 0 14px; color: var(--hi); font-weight: 700; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; letter-spacing: .08em; }
  .card h2 small { font-family: 'Segoe UI', Meiryo, sans-serif; font-weight: normal; color: var(--mut); font-size: var(--fs-s); letter-spacing: 0; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .row > .card { flex: 1 1 400px; min-width: 0; }
  .ctl { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-bottom: 8px; }
  .lbl { font-size: var(--fs-s); color: var(--mut); margin-right: 4px; }
  .chip { border: 1px solid transparent; background: transparent; color: var(--mut); padding: 4px 10px; cursor: pointer; font-family: inherit; font-size: var(--fs-s); transition: background .15s, color .15s, border-color .15s; }
  .chip:hover { border-color: var(--line2); color: var(--hi); }
  .chip.on { background: #fff; color: #000; font-weight: 600; }
  .sep { width: 1px; height: 16px; background: var(--line2); margin: 0 8px; }
  .periods { display: flex; gap: 18px; font-size: var(--fs-s); margin: 10px 0 2px; flex-wrap: wrap; color: var(--tx); font-variant-numeric: tabular-nums; }
  .pa::before, .pb::before { content: ''; display: inline-block; width: 8px; height: 8px; margin-right: 6px; }
  .pa::before { background: var(--hi); }
  .pb::before { background: var(--b); }
  .hint { font-size: var(--fs-s); color: var(--mut); }
  .pbox { background: #000; border: 1px solid var(--line2); padding: 12px 14px; margin: 6px 0 12px; }
  .prow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .plbl { font-size: var(--fs-s); color: var(--mut); letter-spacing: .1em; }
  .dates { display: inline-flex; align-items: center; gap: 6px; }
  .sel { background: #000; border: 1px solid var(--line2); color: var(--hi); padding: 5px 8px; font-family: inherit; font-size: var(--fs); color-scheme: dark; cursor: pointer; border-radius: 0; }
  .sel:hover { border-color: #888; }
  .sel:focus { outline: none; border-color: #fff; }
  .periods b { color: var(--hi); font-weight: 700; }
  .periods .hint { margin-left: auto; }
  .card h2 > span { text-transform: uppercase; }
  .dwrap { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .dn .seg { transition: stroke-dasharray .9s cubic-bezier(.2,.8,.2,1); cursor: default; }
  .dn .seg:hover { filter: brightness(1.3); }
  svg .dnv { font-family: var(--serif); font-size: 26px; font-weight: 700; fill: #fff; }
  svg .dnl { font-size: 9px; letter-spacing: .18em; fill: var(--mut); }
  .dlg { display: grid; grid-template-columns: 10px minmax(80px, auto) auto auto; gap: 6px 10px; align-items: center; font-size: var(--fs-s); font-variant-numeric: tabular-nums; flex: 1; min-width: 180px; max-width: 380px; }
  .dlg > div { display: contents; }
  .dlg i { width: 10px; height: 10px; display: inline-block; }
  .dlg .nm { color: var(--tx); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dlg b { color: var(--hi); text-align: right; }
  .dlg em { font-style: normal; color: var(--mut); text-align: right; }
  .dpair { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
  .cwrap { display: flex; justify-content: center; margin-bottom: 10px; }
  .clk path { transform-origin: 140px 140px; animation: pop .6s cubic-bezier(.2,.8,.2,1) both; }
  .clk text { font-size: 10px; }
  .scroll-x { overflow-x: auto; }
  .cal .cc { animation: fade .5s both; }
  .cal text { font-size: 9px; letter-spacing: .1em; }
  .burn .bl { font-size: 10px; fill: var(--mut); letter-spacing: .05em; }
  .burn .bl.hi { fill: #fff; font-weight: 700; font-size: 11px; }
  .burn .pulse { animation: pulse 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  .mbar { position: relative; height: 22px; border: 1px solid var(--line2); margin-bottom: 14px; }
  .mbar .mfill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: repeating-linear-gradient(90deg, #fff 0 2px, transparent 2px 6px); opacity: .5; transition: width 1.2s cubic-bezier(.2,.8,.2,1); }
  .mbar span { position: absolute; right: 8px; top: 3px; font-size: 11px; letter-spacing: .16em; color: var(--hi); }
  .tline { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; height: 70px; }
  .th { position: relative; border-bottom: 1px solid #333; }
  .th b, .th s { position: absolute; bottom: 0; display: block; transition: height .6s; }
  .th b { left: 20%; right: 20%; background: #fff; z-index: 1; }
  .th s { left: 0; right: 0; background: #262626; }
  .th span { position: absolute; bottom: -16px; left: 0; font-size: 9px; color: var(--mut); }
  .th.fut { opacity: .35; }
  .th em { position: absolute; top: -14px; left: 0; right: 0; text-align: center; font-style: normal; font-size: 10px; color: #fff; font-weight: 700; }
  .live .kpis { grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; }
  .live .kpi { padding: 9px 12px 6px; }
  .live .kpi .s { display: none; }
  .live .tline { height: 52px; margin-top: 18px; }
  .th.now { border-bottom: 2px solid #fff; }
  .tline { margin-bottom: 18px; }
  .rings { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .rc { display: flex; gap: 16px; align-items: center; border: 1px solid var(--line); border-top: 1px solid #fff; padding: 12px; }
  .rs { flex: 1; min-width: 0; }
  .rn { font-family: var(--serif); font-size: 16px; font-weight: 700; color: var(--hi); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tag { font-family: 'Segoe UI', Meiryo, sans-serif; font-style: normal; font-size: 10px; letter-spacing: .14em; border: 1px solid var(--line2); color: var(--mut); padding: 1px 6px; }
  .tag.ok { background: #fff; color: #000; border-color: #fff; font-weight: 700; }
  .rl { display: flex; justify-content: space-between; font-size: var(--fs-s); padding: 3px 0; border-bottom: 1px solid #161616; font-variant-numeric: tabular-nums; }
  .rl span { color: var(--mut); letter-spacing: .12em; font-size: 10px; }
  .rl b { color: var(--hi); }
  .rg .rgf { transition: stroke-dasharray 1.1s cubic-bezier(.2,.8,.2,1); }
  svg .rgv { font-family: var(--serif); font-size: 28px; font-weight: 700; fill: #fff; }
  svg .rgu { font-size: 12px; fill: var(--mut); }
  .pg { display: grid; grid-template-columns: minmax(110px, 30%) 1fr 70px 44px; gap: 9px 12px; align-items: center; font-size: var(--fs); font-variant-numeric: tabular-nums; }
  .pg .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pg .tr { position: relative; height: 10px; background: #141414; }
  .pg .pf { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #fff; transition: width .9s cubic-bezier(.2,.8,.2,1); }
  .pg .tr i { position: absolute; top: -4px; bottom: -4px; width: 1px; background: #8a8a8a; }
  .pg .va { text-align: right; color: var(--hi); } .pg .va small { color: var(--mut); }
  .pg .vb { text-align: right; color: var(--mut); font-size: var(--fs-s); }
  @keyframes pop { from { opacity: 0; transform: scale(.6); } }
  @keyframes pulse { from { transform: scale(1); opacity: .9; } to { transform: scale(4); opacity: 0; } }
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .kpi { border: 1px solid var(--line); border-top: 1px solid #fff; padding: 12px 14px 14px; transition: background .15s; }
  .kpi:hover { background: #0e0e0e; }
  .kpi .t { font-size: var(--fs-s); color: var(--mut); letter-spacing: .04em; }
  .kpi .v { font-family: var(--serif); font-size: var(--fs-l); font-weight: 700; color: var(--hi); margin-top: 6px; font-variant-numeric: tabular-nums; display: flex; align-items: baseline; flex-wrap: wrap; }
  .kpi .v small { font-family: 'Segoe UI', Meiryo, sans-serif; font-size: var(--fs-s); font-weight: normal; color: var(--mut); margin-left: 4px; }
  .kpi .dl { font-family: 'Segoe UI', Meiryo, sans-serif; font-style: normal; font-size: 16px; font-weight: 700; margin-left: 12px; padding: 1px 7px; }
  .kpi .dl.up { background: #fff; color: #000; }
  .kpi .dl.down { border: 1px solid var(--line2); color: var(--mut); }
  .kpi .s { font-size: var(--fs-s); color: var(--mut); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .up { color: var(--hi); font-weight: 700; }
  .down { color: var(--mut); font-weight: 600; }
  table { border-collapse: collapse; width: 100%; font-size: var(--fs); font-variant-numeric: tabular-nums; }
  th, td { border-bottom: 1px solid #1c1c1c; padding: 7px 10px; text-align: right; white-space: nowrap; }
  th { color: var(--mut); font-weight: normal; font-size: var(--fs-s); position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid #fff; }
  th:first-child, td:first-child { text-align: left; }
  tr:hover td { background: #111; }
  tr.click { cursor: pointer; }
  tr.sel td { background: #fff; color: #000; }
  .scroll { max-height: 480px; overflow: auto; }
  .scroll::-webkit-scrollbar { width: 8px; height: 8px; } .scroll::-webkit-scrollbar-thumb { background: #333; }
  svg text { font-family: 'Segoe UI', Meiryo, sans-serif; fill: var(--mut); font-size: 10px; }
  svg .gl { stroke: #1e1e1e; }
  svg rect.b { transform-box: fill-box; transform-origin: 50% 100%; animation: grow .5s cubic-bezier(.2,.8,.2,1) both; transition: filter .15s; }
  svg rect.b:hover { filter: brightness(1.4); }
  svg.still rect.b { animation: none; }
  svg .vl { fill: var(--tx); font-size: 10px; animation: fade .5s .25s both; }
  svg .ln { animation: fade .6s .2s both; }
  .brush { user-select: none; touch-action: none; cursor: crosshair; }
  .loading { padding: 80px; text-align: center; color: var(--mut); letter-spacing: .2em; font-family: var(--serif); }
  .reading td:first-child { color: var(--mut); width: 96px; font-size: var(--fs-s); }
  .reading td { white-space: normal; text-align: left; line-height: 1.7; }
  .heat td { text-align: center; font-size: var(--fs-s); padding: 6px 4px; }
  .hb { display: grid; grid-template-columns: minmax(120px, 34%) 1fr 54px 54px; gap: 7px 10px; align-items: center; font-size: var(--fs); font-variant-numeric: tabular-nums; }
  .hb .nm { color: var(--tx); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hb .tr { position: relative; height: 14px; }
  .hb .fa, .hb .fb { position: absolute; left: 0; height: 6px; transition: width .6s cubic-bezier(.2,.8,.2,1); width: 0; }
  .hb .fa { top: 0; background: var(--hi); }
  .hb .fb { bottom: 0; background: var(--b); }
  .hb .va, .hb .vb { text-align: right; }
  .hb .vb { color: var(--mut); }
  .lgd { display: flex; gap: 16px; font-size: var(--fs-s); color: var(--mut); margin-top: 6px; flex-wrap: wrap; }
  .lgd i { display: inline-block; width: 8px; height: 8px; margin-right: 6px; }
  #tip { position: fixed; pointer-events: none; z-index: 60; background: #fff; color: #000; padding: 5px 10px; font-size: var(--fs-s); font-weight: 600; opacity: 0; transition: opacity .12s; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #tip.on { opacity: 1; }
  @keyframes grow { from { transform: scaleY(0); } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  @keyframes fade { from { opacity: 0; } }
  @media (max-width: 900px) { .app { grid-template-columns: 1fr; } nav { position: static; height: auto; } .navfoot { position: static; margin: 10px; } main { padding: 20px; } }
</style>
</head>
<body>
<div class="app">
  <nav>
    <div class="brand"><b>KYODO ANALYTICS</b><div id="at">LOADING</div></div><div class="navlbl">ITEMS</div>
    <div id="items"></div>
    <div class="navfoot"><button class="btn" id="reload">REFRESH</button></div>
  </nav>
  <main><div class="ph" id="ph"></div><div id="main"><div class="loading">SELECT</div></div></main>
</div>
<div id="tip"></div>
<script>
var ITEMS = [
  { id: 'master', name: '経堂マスタ', sub: 'LIVE · TARGET · PACE' },
  { id: 'jl', name: '入会・退会', sub: 'DAY · WEEKDAY · HOUR' },
  { id: 'visit', name: '見学・体験', sub: 'APPLY → JOIN' },
  { id: 'op', name: 'オプション', sub: 'START · STOP · SHARE' },
  { id: 'hq', name: '会員動向', sub: 'PLAN · ACTUAL · LAST YEAR' },
  { id: 'member', name: '会員分析', sub: 'RETENTION · PLAN · CHURN' },
  { id: 'unpaid', name: '未納', sub: 'COUNT · AMOUNT · RECOVERY' }
];
var DATA = {}, CUR = null, FIRST = true, KEYNAV = null;
var A_C = '#ffffff', RED = '#6e6e6e', GRAY = '#2b2b2b', PREV = '#3d3d3d', FUT = '#9a9a9a', PLAN = '#cfcfcf';
var WD = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
var MON3 = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];

/* ---------- 共通 ---------- */
function $(id) { return document.getElementById(id); }
function h(tag, attrs, html) { var e = document.createElement(tag); for (var k in (attrs || {})) e.setAttribute(k, attrs[k]); if (html != null) e.innerHTML = html; return e; }
function num(v) { if (typeof v === 'number') return v; var s = String(v == null ? '' : v).replace(/[^\d.\-]/g, ''); if (s === '' || s === '-' || isNaN(+s)) return null; return +s; }
function fmt(n, d) { if (n == null || isNaN(n)) return '—'; d = d || 0; return Number(n).toLocaleString('ja-JP', { maximumFractionDigits: d, minimumFractionDigits: d }); }
function chg(a, b) {
  if (a == null || b == null || !b) return '<span class="hint">—</span>';
  var p = Math.round((a / b - 1) * 100);
  return '<span class="' + (p >= 0 ? 'up' : 'down') + '">' + (p >= 0 ? '+' : '−') + Math.abs(p) + '%</span>';
}
function dn(s) { return Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +(s.slice(8, 10) || 1)) / 864e5; }
function dd(n) { return new Date(n * 864e5); }
function ds(n) { var d = dd(n); return d.getUTCFullYear() + '/' + (d.getUTCMonth() + 1) + '/' + d.getUTCDate(); }
function wd(n) { return dd(n).getUTCDay(); }
function mi(s) { return +s.slice(0, 4) * 12 + (+s.slice(5, 7) - 1); }
function ms(i) { return Math.floor(i / 12) + '/' + (i % 12 + 1); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function chips(el, list, cur, onPick, cls) {
  list.forEach(function (x) {
    var b = h('button', { class: 'chip' + (cls ? ' ' + cls : '') + (x[0] === cur ? ' on' : '') }, x[1]);
    b.onclick = function () { onPick(x[0]); };
    el.appendChild(b);
  });
}
var CARD_I = 0;
function card(title, sub) {
  var c = h('div', { class: 'card' + (FIRST ? ' anim' : '') });
  c.style.animationDelay = (FIRST ? CARD_I++ * 45 : 0) + 'ms';
  var t = h('h2', null, '<span>' + esc(title) + '</span>' + (sub ? '<small>' + sub + '</small>' : ''));
  c.appendChild(t);
  
  return c;
}
/** 見出しの文字を一瞬乱してから表示する */
var GL = '▓▒░█▚▞01ｱｲｳｴｵｶｷｸｹｺ';
function scramble(el, text) {
  var n = 0, L = text.length;
  var tm = setInterval(function () {
    n++;
    var k = Math.floor(n / 2), s = '';
    for (var i = 0; i < L; i++) s += i < k ? text[i] : (text[i] === ' ' ? ' ' : GL[(Math.random() * GL.length) | 0]);
    el.textContent = s;
    if (k >= L) { clearInterval(tm); el.textContent = text; }
  }, 22);
}
/** 数字をカウントアップ（乱数を混ぜて止まる） */
function countUp(root) {
  root.querySelectorAll('[data-v]').forEach(function (el) {
    var v = +el.getAttribute('data-v'), d = +(el.getAttribute('data-d') || 0), t0 = performance.now(), dur = 650;
    if (isNaN(v)) return;
    (function step(t) {
      var p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      el.textContent = fmt(v * e + (p < 1 ? (Math.random() - .5) * Math.abs(v) * .04 * (1 - p) : 0), d);
      if (p < 1) requestAnimationFrame(step); else el.textContent = fmt(v, d);
    })(t0);
  });
}
function kpi(t, v, u, d, s) {
  var val = v == null || isNaN(v) ? '—' : '<span data-v="' + v + '" data-d="' + (d || 0) + '">' + fmt(v, d || 0) + '</span>';
  var m = String(s || '').match(/<span class="(up|down)">[^<]*<\/span>/), dl = '';
  if (m && String(s).indexOf('TODAY') < 0) { dl = '<em class="dl ' + m[1] + '">' + m[0].replace(/<[^>]+>/g, '') + '</em>'; s = s.replace(m[0], '').replace(/[\s　]+$/, ''); }
  return '<div class="kpi"><div class="t">' + t + '</div><div class="v">' + val + (u ? '<small>' + u + '</small>' : '') + dl + '</div><div class="s">' + (s || '&nbsp;') + '</div></div>';
}
/** 目盛りが切りのいい数字になるよう最大値と間隔を決める（4〜5本） */
function ticks(max) {
  max = max > 0 ? max : 1;
  var raw = max / 4, p = Math.pow(10, Math.floor(Math.log10(raw))), r = raw / p;
  var step = (r <= 1 ? 1 : r <= 2 ? 2 : r <= 2.5 ? 2.5 : r <= 5 ? 5 : 10) * p;
  if (max < 4 && Number.isInteger(max)) step = 1;
  var top = Math.ceil(max / step - 1e-9) * step;
  return { max: top, step: step, n: Math.round(top / step) };
}
function kpis(c, html) { var d = h('div', { class: 'kpis' }, html); c.appendChild(d); countUp(d); }

function load(item, force) {
  if (DATA[item] && !force) return Promise.resolve(DATA[item]);
  return new Promise(function (res, rej) {
    var done = function (r) { r = typeof r === 'string' ? JSON.parse(r) : r; if (!r || !r.ok) return rej(r); DATA[item] = r; res(r); };
    if (window.google && google.script && google.script.run) google.script.run.withSuccessHandler(done).withFailureHandler(rej).dashData(item, !!force);
    else fetch('dash_' + item + '.json').then(function (x) { return x.json(); }).then(done, rej);
  });
}

  bars(g, mlab, [{ name: 'ACTUAL · THIS MONTH IN PROGRESS', color: function (i) { return i === 4 ? FUT : A_C; }, lc: A_C, vals: row5.slice(1, 6).map(num) }], { height: 220, lines: plan != null ? [{ name: 'TARGET', color: PLAN, vals: [null, null, null, null, plan] }] : [] });
  if (MS.jump) { MS.jump = false; c1.scrollIntoView(); }
}

/* ---------- 会員分析 ---------- */
var MB = { kind: 'join', view: '60', mode: 'A', cmp: 'yoy', A: null, B: null, anim: true };
function renderMember(main) {
  var D = DATA.member, T = mi(D.today), st = MB, rr = function () { renderMember(main); };
  if (!st.A) { st.A = [T - 12, T - 1]; st.B = cmpRange(st, 'month'); }
  var mem = D.mem.map(function (r) { return { j: mi(r[0]), l: r[1] ? mi(r[1]) : null, p: r[2], age: r[3], sex: r[4] }; });
  var lv = D.leave.map(function (r) { return { m: mi(r[0]), p: r[1], ten: r[3] }; });
  var sv = (D.survey || []).map(function (r) { return { m: mi(r[0]), r: r[1], f: r[2], t: r[3] }; });
  var first = mem.reduce(function (m, e) { return Math.min(m, e.j); }, T);
  var src = st.kind === 'join' ? mem.map(function (e) { return e.j; }) : lv.map(function (e) { return e.m; });
  var cntM = {}; src.forEach(function (x) { cntM[x] = (cntM[x] || 0) + 1; });
  var from = st.view === 'all' ? first : Math.max(first, T - (+st.view));
  var buckets = []; for (var i = from; i <= T; i++) buckets.push({ s: i, e: i, label: ms(i), v: cntM[i] || 0 });
  main.innerHTML = '';
  var top = card('MEMBERS　MONTHLY', '累計入会 / 累計退会');
  var c1 = h('div', { class: 'ctl' });
  chips(c1, [['join', '入会'], ['leave', '退会']], st.kind, function (v) { st.kind = v; st.anim = true; rr(); });
  c1.appendChild(h('span', { class: 'sep' }));
  c1.appendChild(h('span', { class: 'lbl' }, 'RANGE'));
  chips(c1, [['24', '2Y'], ['60', '5Y'], ['all', 'ALL']], st.view, function (v) { st.view = v; st.anim = true; keepInView(st, 'month'); rr(); });
  top.appendChild(c1);
  periodBar(top, st, 'month', rr);
  var bel = h('div'); top.appendChild(bel);
  main.appendChild(top);
  brush(bel, buckets, st, onBrush(st, 'month', rr), function (b) { return b.s % 12 === 0 ? String(Math.floor(b.s / 12)) : ''; });

  var A = st.A, B = st.B;
  var inR = function (x, r) { return r && x >= r[0] && x <= r[1]; };
  var ret = function (r, k, filt) {
    var n = 0, s = 0;
    mem.forEach(function (e) { if (!inR(e.j, r) || e.j + k > T || (filt && !filt(e))) return; n++; if (e.l == null || e.l - e.j > k) s++; });
    return n ? { r: s / n * 100, n: n } : null;
  };
  var jA = mem.filter(function (e) { return inR(e.j, A); }).length, jB = mem.filter(function (e) { return inR(e.j, B); }).length;
  var lA = lv.filter(function (e) { return inR(e.m, A); }).length, lB = lv.filter(function (e) { return inR(e.m, B); }).length;
  var k = card('SUMMARY', 'BY JOIN MONTH / LEAVE MONTH');
  kpis(k, kpi('入会', jA, '', 0, B ? 'VS ' + fmt(jB) + '　' + chg(jA, jB) : '') +
    kpi('退会', lA, '', 0, B ? 'VS ' + fmt(lB) + '　' + chg(lA, lB) : '') +
    [1, 3, 6, 12].map(function (kk) { var a = ret(A, kk), b = B && ret(B, kk); return kpi(kk + 'M RETENTION', a ? a.r : null, '%', 1, (a ? 'OF ' + a.n : 'NOT YET ' + kk + 'M') + (b ? '　VS ' + fmt(b.r, 1) + '%' : '')); }).join(''));
  main.appendChild(k);

  var c2 = card('COHORT RETENTION', '% STILL ACTIVE · UP TO 24 COHORTS');
  var t = '<table class="heat"><tr><th>COHORT</th><th>SIZE</th>';
  for (var kk = 1; kk <= 12; kk++) t += '<th>M' + kk + '</th>';
  t += '</tr>';
  for (var j = Math.max(A[0], A[1] - 23); j <= A[1]; j++) {
    var co = mem.filter(function (e) { return e.j === j; });
    if (!co.length) continue;
    t += '<tr><td>' + ms(j) + '</td><td>' + co.length + '</td>';
    for (kk = 1; kk <= 12; kk++) {
      if (j + kk > T) { t += '<td></td>'; continue; }
      var stay = co.filter(function (e) { return e.l == null || e.l - e.j > kk; }).length / co.length;
      var al = Math.max(0.04, Math.pow(stay, 2) * 0.9);
      t += '<td style="background:rgba(236,236,236,' + al.toFixed(2) + ');color:' + (al > .45 ? '#000' : '#bbb') + '" data-t="' + ms(j) + ' COHORT　M' + kk + '　' + Math.round(stay * 100) + '%">' + Math.round(stay * 100) + '</td>';
    }
    t += '</tr>';
  }
  c2.appendChild(h('div', { class: 'scroll' }, t + '</table>'));
  main.appendChild(c2);

  var row = h('div', { class: 'row' });
  var c3 = card('BY PLAN', 'JOINS · 6M RETENTION');
  var pr = D.plans.map(function (p, i) {
    var f = function (e) { return e.p === i; };
    return { p: p, a: mem.filter(function (e) { return inR(e.j, A) && f(e); }).length, b: mem.filter(function (e) { return inR(e.j, B) && f(e); }).length, ra: ret(A, 6, f), rb: B && ret(B, 6, f) };
  }).filter(function (x) { return x.a || x.b; }).sort(function (p, q) { return q.a - p.a; });
  var t3 = '<table><tr><th>PLAN</th><th>JOIN</th>' + (B ? '<th>VS</th>' : '') + '<th>6M</th>' + (B ? '<th>VS</th>' : '') + '</tr>';
  pr.forEach(function (x) { t3 += '<tr><td>' + esc(x.p) + '</td><td>' + x.a + '</td>' + (B ? '<td>' + x.b + '</td>' : '') + '<td>' + (x.ra ? fmt(x.ra.r, 0) + '%' : '—') + '</td>' + (B ? '<td>' + (x.rb ? fmt(x.rb.r, 0) + '%' : '—') + '</td>' : '') + '</tr>'; });
  donut(c3, pr.map(function (x) { return { label: x.p, v: x.a }; }), { unit: 'JOINED', size: 150, sw: 12 });
  c3.appendChild(h('div', { class: 'scroll', style: 'margin-top:12px' }, t3 + '</table>'));
  row.appendChild(c3);
  var c4 = card('AGE · SEX', 'JOINED');
  var ga = h('div'); c4.appendChild(ga);
  var gs = h('div'); c4.appendChild(gs);
  row.appendChild(c4);
  main.appendChild(row);

  var c6 = card('LEAVE REASONS', '退会アンケート');
  var rA = {}, rB = {};
  sv.forEach(function (e) { if (inR(e.m, A)) rA[e.r] = (rA[e.r] || 0) + 1; if (inR(e.m, B)) rB[e.r] = (rB[e.r] || 0) + 1; });
  var nAs = sv.filter(function (e) { return inR(e.m, A); }).length, nBs = sv.filter(function (e) { return inR(e.m, B); }).length;
  c6.appendChild(h('div', { class: 'hint', style: 'margin-bottom:8px' }, 'RESPONSES ' + nAs + (B ? '　VS ' + nBs : '')));
  main.appendChild(c6);
  hbars(c6, D.sreasons.map(function (r, i) { return { label: r, a: rA[i] || 0, b: rB[i] || 0 }; }).filter(function (x) { return (x.a || x.b) && x.label !== '（なし）'; }).sort(function (p, q) { return q.a - p.a; }), !!B);

  var row2 = h('div', { class: 'row' });
  var c5 = card('TENURE AT LEAVE', 'LEFT IN SELECTED PERIOD');
  var g5 = h('div'); c5.appendChild(g5); row2.appendChild(c5);
  var c7 = card('VISIT FREQUENCY', '退会アンケート');
  row2.appendChild(c7);
  var c8 = card('USUAL TIME SLOTS', '退会アンケート · MULTIPLE ANSWERS');
  row2.appendChild(c8);
  main.appendChild(row2);
  var fA = {}, fB = {};
  sv.forEach(function (e) { if (inR(e.m, A)) fA[e.f] = (fA[e.f] || 0) + 1; if (inR(e.m, B)) fB[e.f] = (fB[e.f] || 0) + 1; });
  var fOrd = function (s) { var m = s.match(/週(\d)/); return m ? +m[1] + (s.indexOf('未満') >= 0 ? -0.5 : 0) : 99; };
  hbars(c7, D.freqs.map(function (r, i) { return { label: r, a: fA[i] || 0, b: fB[i] || 0 }; }).filter(function (x) { return x.a || x.b; }).sort(function (p, q) { return fOrd(p.label) - fOrd(q.label); }), !!B);
  var slots = {}, slotsB = {};
  sv.forEach(function (e) {
    String(D.times[e.t] || '').split(/[、,]/).forEach(function (s) { s = s.trim(); if (!s || s === '（なし）') return; if (inR(e.m, A)) slots[s] = (slots[s] || 0) + 1; if (inR(e.m, B)) slotsB[s] = (slotsB[s] || 0) + 1; });
  });
  hbars(c8, Object.keys(Object.assign({}, slots, slotsB)).sort().map(function (s) { return { label: s, a: slots[s] || 0, b: slotsB[s] || 0 }; }), !!B);

  var bands = ['<20', '20s', '30s', '40s', '50s', '60+'];
  var band = function (a) { return a < 20 ? 0 : a >= 60 ? 5 : Math.floor(a / 10) - 1; };
  var cntBy = function (list, inF, key, n) { var c = new Array(n).fill(0); list.forEach(function (e) { if (inF(e)) { var b = key(e); if (b >= 0 && b < n) c[b]++; } }); return c; };
  bars(ga, bands, AB(B, cntBy(mem, function (e) { return inR(e.j, A) && e.age > 0; }, function (e) { return band(e.age); }, 6), B && cntBy(mem, function (e) { return inR(e.j, B) && e.age > 0; }, function (e) { return band(e.age); }, 6)), { height: 180 });
  var sx = ['男', '女'];
  gs.style.marginTop = '14px';
  donut(gs, sx.map(function (s) { return { label: s === '男' ? 'MALE' : 'FEMALE', v: mem.filter(function (e) { return inR(e.j, A) && e.sex === s; }).length }; }), { unit: 'SEX', size: 140, sw: 11 });
  var tb = ['<3M', '3–5M', '6–11M', '1–2Y', '2Y+'];
  var tband = function (m) { return m < 3 ? 0 : m < 6 ? 1 : m < 12 ? 2 : m < 24 ? 3 : 4; };
  bars(g5, tb, AB(B, cntBy(lv, function (e) { return inR(e.m, A); }, function (e) { return tband(e.ten); }, 5), B && cntBy(lv, function (e) { return inR(e.m, B); }, function (e) { return tband(e.ten); }, 5)), { height: 200 });
}

/* ---------- 未納 ---------- */
var UP = { m: 2 };
function renderUnpaid(main) {
  var D = DATA.unpaid, R = D.rows, head = D.head;
  main.innerHTML = '';
  var cols = [[1, 'COUNT', ''], [2, 'TOTAL', 'JPY'], [3, 'COLLECTED', 'JPY'], [4, 'RECOVERY', '%'], [6, 'OUTSTANDING', 'JPY'], [8, '1M RECOVERY', '%'], [9, '2M RECOVERY', '%'], [10, 'BAD-DEBT RECOVERY', '%']];
  var top = card('未納　TREND', '未納管理 · MONTHLY SNAPSHOT');
  var c1 = h('div', { class: 'ctl' });
  chips(c1, cols.map(function (c) { return [c[0], c[1]]; }), UP.m, function (v) { UP.m = v; renderUnpaid(main); });
  top.appendChild(c1);
  var g = h('div'); top.appendChild(g);
  main.appendChild(top);
  var col = cols.filter(function (c) { return c[0] === UP.m; })[0];
  var labels = R.map(function (r) { return r[0]; }), vals = R.map(function (r) { return num(r[col[0]]); });
  var last = vals[vals.length - 1], prev = vals[vals.length - 2], yo = vals.length > 12 ? vals[vals.length - 13] : null;
  var dec = col[2] === '%' ? 1 : 0;
  var k = card('SUMMARY', 'AS OF ' + labels[labels.length - 1]);
  kpis(k, kpi(col[1], last, col[2], dec, 'PREV ' + fmt(prev, dec) + '　' + chg(last, prev)) +
    kpi('12M AVERAGE', vals.slice(-12).reduce(function (p, q) { return p + (q || 0); }, 0) / Math.min(12, vals.length), col[2], dec, '') +
    (yo != null ? kpi('LAST YEAR', yo, col[2], dec, 'YOY ' + chg(last, yo)) : '') +
    kpi('COUNT', num(R[R.length - 1][1]), '', 0, '') + kpi('RECOVERY', num(R[R.length - 1][4]), '%', 1, ''));
  main.insertBefore(k, top.nextSibling);
  bars(g, labels, [{ name: col[1], color: function (i) { return i === labels.length - 1 ? FUT : A_C; }, lc: A_C, vals: vals }], { height: 240, fmt: function (v) { return col[2] === 'JPY' ? '¥' + fmt(v / 1000) + 'K' : fmt(v, dec) + (col[2] === '%' ? '%' : ''); } });
  var c2 = card('MONTHLY TABLE');
  var t = '<table><tr>' + [0, 1, 2, 3, 4, 6, 7, 8, 9, 10].map(function (i) { return '<th>' + esc(head[i]) + '</th>'; }).join('') + '</tr>';
  R.slice().reverse().forEach(function (r) { t += '<tr>' + [0, 1, 2, 3, 4, 6, 7, 8, 9, 10].map(function (i) { return '<td>' + esc(r[i]) + '</td>'; }).join('') + '</tr>'; });
  c2.appendChild(h('div', { class: 'scroll' }, t + '</table>'));
  main.appendChild(c2);
}

/* ---------- 画面の切り替え ---------- */
var RENDER = { jl: renderJl, visit: renderVisit, op: renderOp, hq: renderHq, master: renderMaster, member: renderMember, unpaid: renderUnpaid };
function drawItems() {
  var el = $('items'); el.innerHTML = '';
  ITEMS.forEach(function (it, i) {
    var d = h('div', { class: 'nv' + (CUR === it.id ? ' on' : '') }, it.name + '<small>' + it.sub + '</small>');
    d.onclick = function () { open(it.id); };
    el.appendChild(d);
  });
}
function render(id) {
  CARD_I = 0; FIRST = true; KEYNAV = null; RENDER[id]($('main')); FIRST = false;
}
function open(id, force) {
  CUR = id; drawItems();
  var it = ITEMS.filter(function (x) { return x.id === id; })[0];
  $('ph').innerHTML = '<h1>' + it.name + '</h1><div>' + it.sub + '</div>';
  try { if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id); } catch (e) {}
  var main = $('main');
  main.innerHTML = '<div class="loading">LOADING</div>';
  load(id, force).then(function (d) {
    if (CUR !== id) return;
    $('at').textContent = d.at;
    [JL, VS, OP, MB].forEach(function (s) { s.anim = true; });
    render(id);
  }, function (err) { main.innerHTML = '<div class="loading">LOAD ERROR　' + esc((err && err.message) || err) + '</div>'; });
}
$('reload').onclick = function () { if (CUR) open(CUR, true); };
var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { if (CUR && DATA[CUR]) render(CUR); }, 200); });
document.addEventListener('keydown', function (e) {
  if (!KEYNAV || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') || e.altKey || e.ctrlKey || e.metaKey) return;
  var tg = (e.target && e.target.tagName) || '';
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(tg)) return;
  e.preventDefault();
  KEYNAV(e.key === 'ArrowRight' ? 1 : -1);
});
window.addEventListener('hashchange', function () { var id = location.hash.slice(1); if (RENDER[id] && id !== CUR) open(id); });
drawItems();
var start = (location.hash || '').slice(1);
open(RENDER[start] ? start : 'master');
</script>
