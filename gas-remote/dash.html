<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root {
    --bg: #191919; --side: #202020; --panel: #202020; --line: #2f2f2f; --line2: #3a3a3a; --hover: #2c2c2c;
    --tx: #d4d4d4; --mut: #8f8f8f; --dim: #5a5a5a; --hi: #f0f0f0; --b: #6b6b6b;
    --fs: 13px; --fs-s: 12px; --fs-l: 26px; --fs-h: 28px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--tx); font-family: 'Segoe UI', 'Hiragino Sans', Meiryo, sans-serif; font-size: var(--fs); -webkit-font-smoothing: antialiased; }
  .app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
  nav { background: var(--side); padding: 14px 8px; position: sticky; top: 0; height: 100vh; border-right: 1px solid #262626; }
  .brand { padding: 4px 10px 14px; }
  .brand b { font-size: 14px; color: var(--hi); font-weight: 600; }
  .brand div { font-size: var(--fs-s); color: var(--mut); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .navlbl { font-size: 11px; color: var(--dim); padding: 10px 10px 4px; }
  .nv { display: block; padding: 6px 10px; margin: 1px 0; cursor: pointer; color: var(--mut); border-radius: 5px; transition: background .15s, color .15s; }
  .nv:hover { background: var(--hover); color: var(--tx); }
  .nv.on { background: #2f2f2f; color: var(--hi); }
  .nv small { display: block; font-size: 11px; color: var(--dim); margin-top: 1px; }
  .nv.on small { color: var(--mut); }
  .navfoot { position: absolute; bottom: 14px; left: 8px; right: 8px; }
  .btn { background: transparent; border: 1px solid var(--line); color: var(--mut); padding: 7px 10px; cursor: pointer; font-family: inherit; font-size: var(--fs-s); width: 100%; border-radius: 5px; transition: all .15s; }
  .btn:hover { background: var(--hover); color: var(--hi); }
  main { padding: 36px 56px 80px; min-width: 0; max-width: 1500px; }
  .ph { margin-bottom: 22px; animation: fade .3s both; }
  .ph h1 { font-size: var(--fs-h); font-weight: 700; color: var(--hi); margin: 0 0 6px; letter-spacing: .01em; }
  .ph div { color: var(--mut); font-size: var(--fs); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; margin-bottom: 14px; }
  .card.anim { animation: rise .35s cubic-bezier(.2,.8,.2,1) both; }
  .card h2 { font-size: 14px; margin: 0 0 12px; color: var(--hi); font-weight: 600; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .card h2 small { font-weight: normal; color: var(--mut); font-size: var(--fs-s); }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .row > .card { flex: 1 1 400px; min-width: 0; }
  .ctl { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-bottom: 8px; }
  .lbl { font-size: var(--fs-s); color: var(--mut); margin-right: 4px; }
  .chip { border: none; background: transparent; color: var(--mut); padding: 4px 9px; cursor: pointer; font-family: inherit; font-size: var(--fs-s); border-radius: 4px; transition: background .15s, color .15s; }
  .chip:hover { background: var(--hover); color: var(--tx); }
  .chip.on { background: #3a3a3a; color: var(--hi); }
  .sep { width: 1px; height: 16px; background: var(--line); margin: 0 8px; }
  .periods { display: flex; gap: 18px; font-size: var(--fs-s); margin: 8px 0 6px; flex-wrap: wrap; color: var(--tx); font-variant-numeric: tabular-nums; }
  .pa::before, .pb::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
  .pa::before { background: var(--hi); }
  .pb::before { background: var(--b); }
  .hint { font-size: var(--fs-s); color: var(--mut); }
  .pbox { background: #1c1c1c; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin: 4px 0 10px; }
  .prow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .plbl { font-size: var(--fs-s); color: var(--mut); }
  .dates { display: inline-flex; align-items: center; gap: 6px; }
  .sel { background: #262626; border: 1px solid var(--line2); color: var(--hi); border-radius: 5px; padding: 5px 8px; font-family: inherit; font-size: var(--fs); color-scheme: dark; cursor: pointer; }
  .sel:hover { border-color: #4a4a4a; }
  .sel:focus { outline: none; border-color: #6b6b6b; }
  .periods b { color: var(--hi); font-weight: 600; }
  .periods .hint { margin-left: auto; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
  .kpi { border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; transition: background .15s; }
  .kpi:hover { background: #242424; }
  .kpi .t { font-size: var(--fs-s); color: var(--mut); }
  .kpi .v { font-size: var(--fs-l); font-weight: 700; color: var(--hi); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .kpi .v small { font-size: var(--fs-s); font-weight: normal; color: var(--mut); margin-left: 3px; }
  .kpi .s { font-size: var(--fs-s); color: var(--mut); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .up { color: var(--hi); font-weight: 600; }
  .down { color: var(--mut); font-weight: 600; }
  table { border-collapse: collapse; width: 100%; font-size: var(--fs); font-variant-numeric: tabular-nums; }
  th, td { border-bottom: 1px solid var(--line); padding: 7px 10px; text-align: right; white-space: nowrap; }
  th { color: var(--mut); font-weight: normal; font-size: var(--fs-s); position: sticky; top: 0; background: var(--panel); }
  th:first-child, td:first-child { text-align: left; }
  tr:hover td { background: #262626; }
  tr.click { cursor: pointer; }
  tr.sel td { background: #2f2f2f; color: var(--hi); }
  .scroll { max-height: 480px; overflow: auto; }
  .scroll::-webkit-scrollbar { width: 8px; height: 8px; } .scroll::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 4px; }
  svg text { font-family: 'Segoe UI', Meiryo, sans-serif; fill: var(--mut); font-size: 10px; }
  svg .gl { stroke: #2a2a2a; }
  svg rect.b { transform-box: fill-box; transform-origin: 50% 100%; animation: grow .5s cubic-bezier(.2,.8,.2,1) both; transition: filter .15s; }
  svg rect.b:hover { filter: brightness(1.25); }
  svg.still rect.b { animation: none; }
  svg .vl { fill: var(--tx); font-size: 10px; animation: fade .5s .25s both; }
  svg .ln { animation: fade .6s .2s both; }
  .brush { user-select: none; touch-action: none; cursor: crosshair; }
  .loading { padding: 80px; text-align: center; color: var(--mut); }
  .reading td:first-child { color: var(--mut); width: 96px; font-size: var(--fs-s); }
  .reading td { white-space: normal; text-align: left; line-height: 1.7; }
  .heat td { text-align: center; font-size: var(--fs-s); padding: 6px 4px; }
  .hb { display: grid; grid-template-columns: minmax(120px, 34%) 1fr 54px 54px; gap: 7px 10px; align-items: center; font-size: var(--fs); font-variant-numeric: tabular-nums; }
  .hb .nm { color: var(--tx); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hb .tr { position: relative; height: 14px; }
  .hb .fa, .hb .fb { position: absolute; left: 0; height: 6px; border-radius: 3px; transition: width .6s cubic-bezier(.2,.8,.2,1); width: 0; }
  .hb .fa { top: 0; background: var(--hi); }
  .hb .fb { bottom: 0; background: var(--b); }
  .hb .va, .hb .vb { text-align: right; }
  .hb .vb { color: var(--mut); }
  .lgd { display: flex; gap: 16px; font-size: var(--fs-s); color: var(--mut); margin-top: 6px; flex-wrap: wrap; }
  .lgd i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
  #tip { position: fixed; pointer-events: none; z-index: 60; background: #252525; border: 1px solid #3a3a3a; border-radius: 5px; color: var(--hi); padding: 5px 9px; font-size: var(--fs-s); opacity: 0; transition: opacity .12s; white-space: nowrap; box-shadow: 0 4px 16px rgba(0,0,0,.5); font-variant-numeric: tabular-nums; }
  #tip.on { opacity: 1; }
  @keyframes grow { from { transform: scaleY(0); } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  @keyframes fade { from { opacity: 0; } }
  @media (max-width: 900px) { .app { grid-template-columns: 1fr; } nav { position: static; height: auto; } .navfoot { position: static; margin: 10px; } main { padding: 20px; } }
</style>
</head>
<body>
<div class="app">
  <nav>
    <div class="brand"><b>分析ダッシュボード</b><div id="at">読み込み中</div></div><div class="navlbl">項目</div>
    <div id="items"></div>
    <div class="navfoot"><button class="btn" id="reload">最新のデータにする</button></div>
  </nav>
  <main><div class="ph" id="ph"></div><div id="main"><div class="loading">項目を選択</div></div></main>
</div>
<div id="tip"></div>
<script>
var ITEMS = [
  { id: 'jl', name: '入会・退会', sub: '日・曜日・時間帯' },
  { id: 'visit', name: '見学・体験', sub: '申し込みから入会まで' },
  { id: 'op', name: 'オプション', sub: '自動付与・契約追加・停止' },
  { id: 'hq', name: '会員動向', sub: '計画・実績・前年' },
  { id: 'master', name: '経堂マスタ', sub: '5ヶ月の数字と今月の読み' },
  { id: 'member', name: '会員分析', sub: '継続率・プラン・退会理由' },
  { id: 'unpaid', name: '未納', sub: '件数・金額・回収率' }
];
var DATA = {}, CUR = null, FIRST = true, KEYNAV = null;
var A_C = '#e6e6e6', RED = '#6b6b6b', GRAY = '#3a3a3a', PREV = '#474747', FUT = '#9a9a9a', PLAN = '#bdbdbd';
var WD = ['日', '月', '火', '水', '木', '金', '土'];

/* ---------- 共通 ---------- */
function $(id) { return document.getElementById(id); }
function h(tag, attrs, html) { var e = document.createElement(tag); for (var k in (attrs || {})) e.setAttribute(k, attrs[k]); if (html != null) e.innerHTML = html; return e; }
function num(v) { if (typeof v === 'number') return v; var s = String(v == null ? '' : v).replace(/[^\d.\-]/g, ''); if (s === '' || s === '-' || isNaN(+s)) return null; return +s; }
function fmt(n, d) { if (n == null || isNaN(n)) return '—'; d = d || 0; return Number(n).toLocaleString('ja-JP', { maximumFractionDigits: d, minimumFractionDigits: d }); }
function chg(a, b) {
  if (a == null || b == null || !b) return '<span class="hint">—</span>';
  var p = Math.round((a / b - 1) * 100);
  return '<span class="' + (p >= 0 ? 'up' : 'down') + '">' + (p >= 0 ? '+' : '−') + Math.abs(p) + '%</span>';
}
function dn(s) { return Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +(s.slice(8, 10) || 1)) / 864e5; }
function dd(n) { return new Date(n * 864e5); }
function ds(n) { var d = dd(n); return d.getUTCFullYear() + '/' + (d.getUTCMonth() + 1) + '/' + d.getUTCDate(); }
function wd(n) { return dd(n).getUTCDay(); }
function mi(s) { return +s.slice(0, 4) * 12 + (+s.slice(5, 7) - 1); }
function ms(i) { return Math.floor(i / 12) + '/' + (i % 12 + 1); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function chips(el, list, cur, onPick, cls) {
  list.forEach(function (x) {
    var b = h('button', { class: 'chip' + (cls ? ' ' + cls : '') + (x[0] === cur ? ' on' : '') }, x[1]);
    b.onclick = function () { onPick(x[0]); };
    el.appendChild(b);
  });
}
var CARD_I = 0;
function card(title, sub) {
  var c = h('div', { class: 'card' + (FIRST ? ' anim' : '') });
  c.style.animationDelay = (FIRST ? CARD_I++ * 45 : 0) + 'ms';
  var t = h('h2', null, '<span>' + esc(title) + '</span>' + (sub ? '<small>' + sub + '</small>' : ''));
  c.appendChild(t);
  
  return c;
}
/** 見出しの文字を一瞬乱してから表示する */
var GL = '▓▒░█▚▞01ｱｲｳｴｵｶｷｸｹｺ';
function scramble(el, text) {
  var n = 0, L = text.length;
  var tm = setInterval(function () {
    n++;
    var k = Math.floor(n / 2), s = '';
    for (var i = 0; i < L; i++) s += i < k ? text[i] : (text[i] === ' ' ? ' ' : GL[(Math.random() * GL.length) | 0]);
    el.textContent = s;
    if (k >= L) { clearInterval(tm); el.textContent = text; }
  }, 22);
}
/** 数字をカウントアップ（乱数を混ぜて止まる） */
function countUp(root) {
  root.querySelectorAll('[data-v]').forEach(function (el) {
    var v = +el.getAttribute('data-v'), d = +(el.getAttribute('data-d') || 0), t0 = performance.now(), dur = 650;
    if (isNaN(v)) return;
    (function step(t) {
      var p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      el.textContent = fmt(v * e + (p < 1 ? (Math.random() - .5) * Math.abs(v) * .04 * (1 - p) : 0), d);
      if (p < 1) requestAnimationFrame(step); else el.textContent = fmt(v, d);
    })(t0);
  });
}
function kpi(t, v, u, d, s) {
  var val = v == null || isNaN(v) ? '—' : '<span data-v="' + v + '" data-d="' + (d || 0) + '">' + fmt(v, d || 0) + '</span>';
  return '<div class="kpi"><div class="t">' + t + '</div><div class="v">' + val + (u ? '<small>' + u + '</small>' : '') + '</div><div class="s">' + (s || '&nbsp;') + '</div></div>';
}
function kpis(c, html) { var d = h('div', { class: 'kpis' }, html); c.appendChild(d); countUp(d); }

function load(item, force) {
  if (DATA[item] && !force) return Promise.resolve(DATA[item]);
  return new Promise(function (res, rej) {
    var done = function (r) { r = typeof r === 'string' ? JSON.parse(r) : r; if (!r || !r.ok) return rej(r); DATA[item] = r; res(r); };
    if (window.google && google.script && google.script.run) google.script.run.withSuccessHandler(done).withFailureHandler(rej).dashData(item, !!force);
    else fetch('dash_' + item + '.json').then(function (x) { return x.json(); }).then(done, rej);
  });
}

/* ---------- ツールチップ ---------- */
document.addEventListener('mousemove', function (e) {
  var t = e.target && e.target.getAttribute && e.target.getAttribute('data-t'), tip = $('tip');
  if (!t) { tip.className = ''; return; }
  tip.textContent = t; tip.className = 'on';
  var vw = document.documentElement.clientWidth, vh = document.documentElement.clientHeight, w = tip.offsetWidth, hh = tip.offsetHeight;
  var x = e.clientX + 14 + w > vw - 8 ? e.clientX - w - 14 : e.clientX + 14;
  tip.style.left = Math.max(8, Math.min(vw - w - 8, x)) + 'px';
  tip.style.top = Math.max(8, Math.min(vh - hh - 8, e.clientY - hh - 10)) + 'px';
});

/* ---------- グラフ ---------- */
function legend(el, list) {
  var d = h('div', { class: 'lgd' });
  list.forEach(function (x) { d.appendChild(h('span', null, '<i style="background:' + x[1] + '"></i>' + esc(x[0]))); });
  el.appendChild(d);
}
/** 縦棒（系列を横に並べる）。series: [{name, color, vals}] / o.lines: 折れ線 */
function bars(el, labels, series, o) {
  o = o || {};
  var W = el.clientWidth || 600, H = o.height || 210, pl = 44, pr = 8, pt = 18, pb = 22;
  var max = 0;
  series.concat(o.lines || []).forEach(function (s) { s.vals.forEach(function (v) { if (v != null && v > max) max = v; }); });
  max = max || 1;
  var gw = (W - pl - pr) / labels.length, ns = series.length, bw = Math.max(1, Math.min(26, gw * 0.78 / ns));
  var y = function (v) { return pt + (H - pt - pb) * (1 - Math.max(0, v) / max); };
  var f = o.fmt || function (v) { return fmt(v, o.dec || 0); };
  var s = '<svg width="' + W + '" height="' + H + '">';
  for (var g = 0; g <= 4; g++) {
    var gv = max * g / 4;
    s += '<line class="gl" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(gv) + '" y2="' + y(gv) + '"/><text x="' + (pl - 6) + '" y="' + (y(gv) + 3) + '" text-anchor="end">' + f(gv) + '</text>';
  }
  var showVal = labels.length * ns <= 40, step = Math.ceil(labels.length / 24);
  labels.forEach(function (lb, i) {
    var x0 = pl + gw * i + (gw - bw * ns) / 2;
    series.forEach(function (se, k) {
      var v = se.vals[i];
      if (v == null) return;
      var col = typeof se.color === 'function' ? se.color(i) : se.color;
      s += '<rect class="b" style="animation-delay:' + (i * 18) + 'ms" x="' + (x0 + k * bw) + '" y="' + y(v) + '" width="' + Math.max(1, bw - 2) + '" height="' + Math.max(0, H - pb - y(v)) + '" fill="' + col + '" data-t="' + esc(lb + '　' + se.name + '　' + f(v)) + '"/>';
      if (showVal) s += '<text class="vl" x="' + (x0 + k * bw + bw / 2 - 1) + '" y="' + (y(v) - 4) + '" text-anchor="middle">' + f(v) + '</text>';
    });
    if (i % step === 0) s += '<text x="' + (pl + gw * i + gw / 2) + '" y="' + (H - 6) + '" text-anchor="middle">' + esc(lb) + '</text>';
  });
  (o.lines || []).forEach(function (ln) {
    var pts = [];
    ln.vals.forEach(function (v, i) { if (v != null) pts.push((pl + gw * i + gw / 2) + ',' + y(v)); });
    s += '<polyline class="ln" points="' + pts.join(' ') + '" fill="none" stroke="' + ln.color + '" stroke-width="1.5" stroke-dasharray="' + (ln.dash || '') + '"/>';
    ln.vals.forEach(function (v, i) { if (v != null) s += '<circle class="ln" cx="' + (pl + gw * i + gw / 2) + '" cy="' + y(v) + '" r="3" fill="' + ln.color + '" data-t="' + esc(labels[i] + '　' + ln.name + '　' + f(v)) + '"/>'; });
  });
  el.innerHTML = s + '</svg>';
  if (o.legend !== false) legend(el, series.map(function (x) { return [x.name, x.lc || (typeof x.color === 'function' ? A_C : x.color)]; }).concat((o.lines || []).map(function (x) { return [x.name, x.color]; })));
}
/** 横棒（A と B を上下に重ねる）。rows: [{label, a, b}] */
function hbars(el, rows, hasB, f) {
  f = f || function (v) { return fmt(v); };
  var max = 1;
  rows.forEach(function (r) { max = Math.max(max, r.a || 0, hasB ? r.b || 0 : 0); });
  var g = h('div', { class: 'hb' });
  rows.forEach(function (r) {
    g.appendChild(h('div', { class: 'nm', title: r.label }, esc(r.label)));
    var tr = h('div', { class: 'tr' }, '<div class="fa" data-w="' + (r.a / max * 100) + '" data-t="' + esc(r.label + '　選んだ期間　' + f(r.a)) + '"></div>' + (hasB ? '<div class="fb" data-w="' + ((r.b || 0) / max * 100) + '" data-t="' + esc(r.label + '　比較期間　' + f(r.b || 0)) + '"></div>' : ''));
    g.appendChild(tr);
    g.appendChild(h('div', { class: 'va' }, f(r.a)));
    g.appendChild(h('div', { class: 'vb' }, hasB ? f(r.b || 0) : ''));
  });
  el.appendChild(g);
  requestAnimationFrame(function () { requestAnimationFrame(function () { g.querySelectorAll('[data-w]').forEach(function (x) { x.style.width = x.getAttribute('data-w') + '%'; }); }); });
}

/**
 * ドラッグで期間を選べる棒グラフ。buckets: [{label, s, e, v}]（s,e は日番号または月番号）
 * ドラッグ・クリックで期間を選ぶ（比較期間は自動）
 */
function brush(el, buckets, st, onSel, tickFn) {
  var W = el.clientWidth || 900, H = 180, pl = 44, pr = 8, pt = 10, pb = 22;
  var n = buckets.length, bw = (W - pl - pr) / Math.max(1, n);
  var max = 1;
  buckets.forEach(function (b) { if (b.v > max) max = b.v; });
  var y = function (v) { return pt + (H - pt - pb) * (1 - v / max); };
  var inR = function (b, r) { return r && b.s >= r[0] && b.e <= r[1]; };
  function draw(tmp, still) {
    var A = tmp && tmp.t === 'A' ? tmp.r : st.A, B = tmp && tmp.t === 'B' ? tmp.r : st.B;
    var s = '<svg class="brush' + (still ? ' still' : '') + '" width="' + W + '" height="' + H + '">';
    for (var g = 0; g <= 2; g++) {
      var gv = max * g / 2;
      s += '<line class="gl" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(gv) + '" y2="' + y(gv) + '"/><text x="' + (pl - 6) + '" y="' + (y(gv) + 3) + '" text-anchor="end">' + fmt(gv) + '</text>';
    }
    [[A, '#8a8a8a', 'rgba(255,255,255,.07)']].forEach(function (z) {
      if (!z[0]) return;
      var i0 = -1, i1 = -1;
      buckets.forEach(function (b, i) { if (b.e >= z[0][0] && b.s <= z[0][1]) { if (i0 < 0) i0 = i; i1 = i; } });

    var f = function (e) { return e.p === i; };
    return { p: p, a: mem.filter(function (e) { return inR(e.j, A) && f(e); }).length, b: mem.filter(function (e) { return inR(e.j, B) && f(e); }).length, ra: ret(A, 6, f), rb: B && ret(B, 6, f) };
  }).filter(function (x) { return x.a || x.b; }).sort(function (p, q) { return q.a - p.a; });
  var t3 = '<table><tr><th>プラン</th><th>入会A</th>' + (B ? '<th>入会B</th>' : '') + '<th>6ヶ月後A</th>' + (B ? '<th>6ヶ月後B</th>' : '') + '</tr>';
  pr.forEach(function (x) { t3 += '<tr><td>' + esc(x.p) + '</td><td>' + x.a + '</td>' + (B ? '<td>' + x.b + '</td>' : '') + '<td>' + (x.ra ? fmt(x.ra.r, 0) + '%' : '—') + '</td>' + (B ? '<td>' + (x.rb ? fmt(x.rb.r, 0) + '%' : '—') + '</td>' : '') + '</tr>'; });
  c3.appendChild(h('div', { class: 'scroll' }, t3 + '</table>'));
  row.appendChild(c3);
  var c4 = card('年齢・性別', '入会した人（名）');
  var ga = h('div'); c4.appendChild(ga);
  var gs = h('div'); c4.appendChild(gs);
  row.appendChild(c4);
  main.appendChild(row);

  var c6 = card('退会理由', '退会アンケート（退会月で数えています）');
  var rA = {}, rB = {};
  sv.forEach(function (e) { if (inR(e.m, A)) rA[e.r] = (rA[e.r] || 0) + 1; if (inR(e.m, B)) rB[e.r] = (rB[e.r] || 0) + 1; });
  var nAs = sv.filter(function (e) { return inR(e.m, A); }).length, nBs = sv.filter(function (e) { return inR(e.m, B); }).length;
  c6.appendChild(h('div', { class: 'hint', style: 'margin-bottom:8px' }, '回答 選んだ期間 ' + nAs + '件' + (B ? '　比較期間 ' + nBs + '件' : '')));
  main.appendChild(c6);
  hbars(c6, D.sreasons.map(function (r, i) { return { label: r, a: rA[i] || 0, b: rB[i] || 0 }; }).filter(function (x) { return (x.a || x.b) && x.label !== '（なし）'; }).sort(function (p, q) { return q.a - p.a; }), !!B);

  var row2 = h('div', { class: 'row' });
  var c5 = card('退会した人の在籍期間', '選んだ期間に退会した人（名）');
  var g5 = h('div'); c5.appendChild(g5); row2.appendChild(c5);
  var c7 = card('退会した人の利用頻度', '退会アンケート');
  row2.appendChild(c7);
  var c8 = card('退会した人の利用時間帯', '退会アンケート（複数回答）');
  row2.appendChild(c8);
  main.appendChild(row2);
  var fA = {}, fB = {};
  sv.forEach(function (e) { if (inR(e.m, A)) fA[e.f] = (fA[e.f] || 0) + 1; if (inR(e.m, B)) fB[e.f] = (fB[e.f] || 0) + 1; });
  var fOrd = function (s) { var m = s.match(/週(\d)/); return m ? +m[1] + (s.indexOf('未満') >= 0 ? -0.5 : 0) : 99; };
  hbars(c7, D.freqs.map(function (r, i) { return { label: r, a: fA[i] || 0, b: fB[i] || 0 }; }).filter(function (x) { return x.a || x.b; }).sort(function (p, q) { return fOrd(p.label) - fOrd(q.label); }), !!B);
  var slots = {}, slotsB = {};
  sv.forEach(function (e) {
    String(D.times[e.t] || '').split(/[、,]/).forEach(function (s) { s = s.trim(); if (!s || s === '（なし）') return; if (inR(e.m, A)) slots[s] = (slots[s] || 0) + 1; if (inR(e.m, B)) slotsB[s] = (slotsB[s] || 0) + 1; });
  });
  hbars(c8, Object.keys(Object.assign({}, slots, slotsB)).sort().map(function (s) { return { label: s, a: slots[s] || 0, b: slotsB[s] || 0 }; }), !!B);

  var bands = ['〜19', '20代', '30代', '40代', '50代', '60代〜'];
  var band = function (a) { return a < 20 ? 0 : a >= 60 ? 5 : Math.floor(a / 10) - 1; };
  var cntBy = function (list, inF, key, n) { var c = new Array(n).fill(0); list.forEach(function (e) { if (inF(e)) { var b = key(e); if (b >= 0 && b < n) c[b]++; } }); return c; };
  bars(ga, bands, AB(B, cntBy(mem, function (e) { return inR(e.j, A) && e.age > 0; }, function (e) { return band(e.age); }, 6), B && cntBy(mem, function (e) { return inR(e.j, B) && e.age > 0; }, function (e) { return band(e.age); }, 6)), { height: 180 });
  var sx = ['男', '女'];
  bars(gs, sx, AB(B, sx.map(function (s) { return mem.filter(function (e) { return inR(e.j, A) && e.sex === s; }).length; }), B && sx.map(function (s) { return mem.filter(function (e) { return inR(e.j, B) && e.sex === s; }).length; })), { height: 140, legend: false });
  var tb = ['〜2ヶ月', '3〜5ヶ月', '6〜11ヶ月', '1〜2年', '2年〜'];
  var tband = function (m) { return m < 3 ? 0 : m < 6 ? 1 : m < 12 ? 2 : m < 24 ? 3 : 4; };
  bars(g5, tb, AB(B, cntBy(lv, function (e) { return inR(e.m, A); }, function (e) { return tband(e.ten); }, 5), B && cntBy(lv, function (e) { return inR(e.m, B); }, function (e) { return tband(e.ten); }, 5)), { height: 200 });
}

/* ---------- 未納 ---------- */
var UP = { m: 2 };
function renderUnpaid(main) {
  var D = DATA.unpaid, R = D.rows, head = D.head;
  main.innerHTML = '';
  var cols = [[1, '未納件数', '件'], [2, '未納の総額', '円'], [3, '回収額', '円'], [4, '回収率', '%'], [6, '未回収額', '円'], [8, '1ヶ月未納の回収率', '%'], [9, '2ヶ月未納の回収率', '%'], [10, '貸倒候補の回収率', '%']];
  var top = card('未納の推移', '未納管理の月ごとのまとめ（各月のその時点の数字）');
  var c1 = h('div', { class: 'ctl' });
  chips(c1, cols.map(function (c) { return [c[0], c[1]]; }), UP.m, function (v) { UP.m = v; renderUnpaid(main); });
  top.appendChild(c1);
  var g = h('div'); top.appendChild(g);
  main.appendChild(top);
  var col = cols.filter(function (c) { return c[0] === UP.m; })[0];
  var labels = R.map(function (r) { return r[0]; }), vals = R.map(function (r) { return num(r[col[0]]); });
  var last = vals[vals.length - 1], prev = vals[vals.length - 2], yo = vals.length > 12 ? vals[vals.length - 13] : null;
  var dec = col[2] === '%' ? 1 : 0;
  var k = card('まとめ', labels[labels.length - 1] + ' 時点');
  kpis(k, kpi(col[1], last, col[2], dec, '前の月 ' + fmt(prev, dec) + col[2] + '　' + chg(last, prev)) +
    kpi('12ヶ月の平均', vals.slice(-12).reduce(function (p, q) { return p + (q || 0); }, 0) / Math.min(12, vals.length), col[2], dec, '') +
    (yo != null ? kpi('前年の同じ月', yo, col[2], dec, '前年比 ' + chg(last, yo)) : '') +
    kpi('未納件数', num(R[R.length - 1][1]), '件', 0, '') + kpi('回収率', num(R[R.length - 1][4]), '%', 1, ''));
  main.insertBefore(k, top.nextSibling);
  bars(g, labels, [{ name: col[1], color: function (i) { return i === labels.length - 1 ? FUT : A_C; }, lc: A_C, vals: vals }], { height: 240, fmt: function (v) { return col[2] === '円' ? '¥' + fmt(v / 1000) + '千' : fmt(v, dec) + (col[2] === '%' ? '%' : ''); } });
  var c2 = card('月ごとの数字');
  var t = '<table><tr>' + [0, 1, 2, 3, 4, 6, 7, 8, 9, 10].map(function (i) { return '<th>' + esc(head[i]) + '</th>'; }).join('') + '</tr>';
  R.slice().reverse().forEach(function (r) { t += '<tr>' + [0, 1, 2, 3, 4, 6, 7, 8, 9, 10].map(function (i) { return '<td>' + esc(r[i]) + '</td>'; }).join('') + '</tr>'; });
  c2.appendChild(h('div', { class: 'scroll' }, t + '</table>'));
  main.appendChild(c2);
}

/* ---------- 画面の切り替え ---------- */
var RENDER = { jl: renderJl, visit: renderVisit, op: renderOp, hq: renderHq, master: renderMaster, member: renderMember, unpaid: renderUnpaid };
function drawItems() {
  var el = $('items'); el.innerHTML = '';
  ITEMS.forEach(function (it, i) {
    var d = h('div', { class: 'nv' + (CUR === it.id ? ' on' : '') }, it.name + '<small>' + it.sub + '</small>');
    d.onclick = function () { open(it.id); };
    el.appendChild(d);
  });
}
function render(id) {
  CARD_I = 0; FIRST = true; KEYNAV = null; RENDER[id]($('main')); FIRST = false;
}
function open(id, force) {
  CUR = id; drawItems();
  var it = ITEMS.filter(function (x) { return x.id === id; })[0];
  $('ph').innerHTML = '<h1>' + it.name + '</h1><div>' + it.sub + '</div>';
  try { if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id); } catch (e) {}
  var main = $('main');
  main.innerHTML = '<div class="loading">読み込み中</div>';
  load(id, force).then(function (d) {
    if (CUR !== id) return;
    $('at').textContent = d.at;
    [JL, VS, OP, MB].forEach(function (s) { s.anim = true; });
    render(id);
  }, function (err) { main.innerHTML = '<div class="loading">読み込めませんでした　' + esc((err && err.message) || err) + '</div>'; });
}
$('reload').onclick = function () { if (CUR) open(CUR, true); };
var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { if (CUR && DATA[CUR]) render(CUR); }, 200); });
document.addEventListener('keydown', function (e) {
  if (!KEYNAV || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') || e.altKey || e.ctrlKey || e.metaKey) return;
  var tg = (e.target && e.target.tagName) || '';
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(tg)) return;
  e.preventDefault();
  KEYNAV(e.key === 'ArrowRight' ? 1 : -1);
});
window.addEventListener('hashchange', function () { var id = location.hash.slice(1); if (RENDER[id] && id !== CUR) open(id); });
drawItems();
var start = (location.hash || '').slice(1);
open(RENDER[start] ? start : 'jl');
</script>
