<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: Meiryo, "Hiragino Sans", sans-serif; margin: 16px; color: #111; font-size: 13px; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    p { margin: 0 0 10px; line-height: 1.5; }
    .drop { border: 2px dashed #111; background: #f7f7f7; padding: 24px 12px; text-align: center; margin: 8px 0 12px; cursor: pointer; }
    .drop.over { background: #fff; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 10px; }
    td { border-bottom: 1px solid #ddd; padding: 6px 4px; vertical-align: top; }
    td.k { width: 150px; font-weight: bold; }
    .done { color: #111; }
    .wait { color: #7A7A7A; }
    .bad { color: #C21632; }
    #files { display: none; }
  </style>
</head>
<body>
  <h1>数値更新ファイルUP</h1>
  <p>次の3つをまとめてドロップしてください（1つずつでも大丈夫です）。中身を見て自動で振り分けます。同じ人・同じ手続きは重ねて入らないので、期間がかぶっていても大丈夫です。</p>
  <table>
    <tr><td class="k">入会手続き一覧表</td><td id="s-join" class="wait">未</td></tr>
    <tr><td class="k">退会手続き一覧表</td><td id="s-leave" class="wait">未</td></tr>
    <tr><td class="k">退会アンケートCSV</td><td id="s-leaveSurvey" class="wait">未</td></tr>
  </table>
  <div id="drop" class="drop">ここにファイルをドロップ（CSV・Excel）<br>またはクリックして選ぶ</div>
  <input id="files" type="file" multiple accept=".csv,.xls,.xlsx,text/csv" />
  <div id="msg" class="bad"></div>
  <script>
    var drop = document.getElementById('drop');
    var input = document.getElementById('files');
    var msg = document.getElementById('msg');
    var queue = [], busy = false;
    drop.onclick = function () { input.click(); };
    input.onchange = function () { add(input.files); input.value = ''; };
    drop.ondragover = function (e) { e.preventDefault(); drop.className = 'drop over'; };
    drop.ondragleave = function () { drop.className = 'drop'; };
    drop.ondrop = function (e) { e.preventDefault(); drop.className = 'drop'; add(e.dataTransfer.files); };

    function add(list) { for (var i = 0; i < list.length; i++) queue.push(list[i]); next(); }

    function setRow(kind, text, cls) {
      var el = document.getElementById('s-' + kind);
      if (el) { el.textContent = text; el.className = cls; }
    }

    function decode(buf) {
      var u8 = new Uint8Array(buf);
      if (u8[0] === 0xEF && u8[1] === 0xBB && u8[2] === 0xBF) return new TextDecoder('utf-8').decode(u8.subarray(3));
      try { return new TextDecoder('utf-8', { fatal: true }).decode(u8); } catch (e) { return new TextDecoder('shift_jis').decode(u8); }
    }

    function parseCsv(text) {
      var rows = [], row = [], cell = '', q = false;
      for (var i = 0; i < text.length; i++) {
        var ch = text[i];
        if (q) {
          if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
          else cell += ch;
        } else if (ch === '"') q = true;
        else if (ch === ',') { row.push(cell); cell = ''; }
        else if (ch === '\n' || ch === '\r') {
          if (ch === '\r' && text[i + 1] === '\n') i++;
          row.push(cell); rows.push(row); row = []; cell = '';
        } else cell += ch;
      }
      if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
      return rows;
    }

    function toBase64(buf) {
      var u8 = new Uint8Array(buf), s = '';
      for (var i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
      return btoa(s);
    }

    function next() {
      if (busy || !queue.length) return;
      busy = true;
      var file = queue.shift();
      msg.textContent = file.name + ' を取り込み中…';
      var fr = new FileReader();
      fr.onload = function () {
        var payload = /\.csv$/i.test(file.name)
          ? { name: file.name, grid: parseCsv(decode(fr.result)) }
          : { name: file.name, base64: toBase64(fr.result) };
        google.script.run.withSuccessHandler(function (res) {
          busy = false;
          if (!res || !res.ok) { msg.textContent = '取り込めませんでした：' + (res && res.message || file.name); next(); return; }
          msg.textContent = '';
          var text = res.kind === 'leaveSurvey'
            ? '取り込み済み：' + res.total + '人（新しく ' + res.added + '人、更新 ' + res.updated + '人）'
            : '取り込み済み：' + res.added + '件追加（重複 ' + res.skipped + '件はスキップ、合計 ' + res.total + '件）';
          setRow(res.kind, text + '　' + file.name, 'done');
          next();
        }).withFailureHandler(function (e) { busy = false; msg.textContent = '取り込めませんでした：' + e.message; next(); })
          .uploadNumbersFile(payload);
      };
      fr.readAsArrayBuffer(file);
    }
  </script>
</body>
</html>
