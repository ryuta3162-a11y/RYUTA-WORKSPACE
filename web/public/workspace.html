<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WORK-LOG</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="WORK-LOG">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"DM Sans"', 'Inter', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
          },
          colors: {
            void: '#030308',
            panel: 'rgba(10, 12, 20, 0.72)',
            line: 'rgba(255, 255, 255, 0.06)',
            accent: '#22d3ee',
            accent2: '#a78bfa',
          },
          boxShadow: {
            panel: '0 0 0 1px rgba(255,255,255,0.06), 0 24px 80px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.04)',
            panelHover: '0 0 0 1px rgba(34, 211, 238, 0.22), 0 28px 90px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.06)',
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg0: #000000;
      --bg1: #050505;
      --glow: rgba(255, 255, 255, 0.12);
      --grid: rgba(255, 255, 255, 0.04);
    }
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
      color: #f4f4f5;
      font-family: 'Outfit', 'Hiragino Sans', Meiryo, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    .font-mono { font-family: 'Outfit', ui-monospace, monospace; }

    .app-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(900px 420px at 8% 0%, rgba(255,255,255,0.07), transparent 58%),
        radial-gradient(700px 380px at 100% 100%, rgba(255,255,255,0.04), transparent 55%),
        #000;
    }
    .app-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0.12;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/%3E%3C/svg%3E");
      mix-blend-mode: overlay;
    }
    .app-bg::after {
      display: none;
    }

    .brand-bar {
      position: relative;
      z-index: 12;
      flex: none;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 18px 2px;
    }
    .brand-mark {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #000;
      border: 1.5px solid #fff;
      color: #fff;
      display: grid;
      place-items: center;
      font-family: 'Syne', 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 10px;
      letter-spacing: -0.08em;
    }
    .brand-name {
      font-family: 'Syne', 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.28em;
      color: #fff;
    }
    .brand-save {
      margin-left: auto;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #737373;
    }

    .pro-panel {
      position: relative;
      z-index: 1;
      background: rgba(8, 8, 8, 0.82);
      backdrop-filter: blur(22px) saturate(120%);
      -webkit-backdrop-filter: blur(22px) saturate(120%);
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 22px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: border-color 0.35s ease, box-shadow 0.35s ease;
      min-width: 0;
      min-height: 0;
    }
    .pro-panel::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, rgba(255,255,255,0.18), transparent 40%, rgba(160,160,160,0.18));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0.45;
    }
    .pro-panel:hover {
      border-color: rgba(255, 255, 255, 0.18);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.10), 0 32px 100px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06);
    }

    .pro-panel.focused-panel {
      position: fixed;
      inset: 1rem;
      z-index: 50;
      height: calc(100vh - 2rem);
      background: rgba(6, 8, 14, 0.92);
    }

    .focus-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: #e8e8ec;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s, background 0.2s, border-color 0.2s;
      z-index: 20;
    }
    .pro-panel:hover .focus-btn { opacity: 1; }
    .focus-btn:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.28); }

    .task-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-left: 2px solid rgba(220, 220, 220, 0.35);
      border-radius: 12px;
      padding: 11px 14px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 8px;
      transition: background 0.2s, border-color 0.2s, transform 0.2s;
      position: relative;
      z-index: 10;
    }
    .task-card:hover {
      background: rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,0.1);
      transform: translateX(2px);
    }
    .task-checkbox {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      margin-top: 2px;
      transition: all 0.2s;
    }
    .task-checkbox:hover { border-color: #fff; background: rgba(255,255,255,0.08); }
    .task-checkbox::after { content: '✓'; font-size: 9px; color: #020208; opacity: 0; transition: opacity 0.2s; font-weight: 700; }
    .task-checkbox.done { background: linear-gradient(135deg, #f5f5f5, #9ca3af); border-color: transparent; }
    .task-checkbox.done::after { opacity: 1; }
    .task-card.done-card { border-left-color: transparent; opacity: 0.45; }
    .task-card.done-card:hover { opacity: 0.85; }

    .pro-input {
      width: 100%;
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f4f4f5;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.35);
    }
    .pro-input:focus {
      border-color: rgba(255, 255, 255, 0.40);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.10), inset 0 2px 8px rgba(0,0,0,0.35);
    }
    .pro-input.ai-loading {
      border-color: rgba(255, 255, 255, 0.35);
      color: #e5e7eb;
    }

    .tab-btn {
      font-size: 11px;
      font-weight: 600;
      color: #71717a;
      padding: 6px 14px;
      border-radius: 8px;
      transition: all 0.25s ease;
      cursor: pointer;
    }
    .tab-btn.active {
      color: #fafafa;
      background: rgba(255,255,255,0.08);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
    }
    .tab-btn:hover:not(.active) { color: #a1a1aa; }

    .ops-tabs {
      display: flex;
      gap: 6px;
    }
    .ops-tab {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #a3a3a3;
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      background: transparent;
      cursor: pointer;
    }
    .ops-tab.active {
      color: #000;
      background: #fff;
      border-color: #fff;
    }
    .ops-form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .ops-form-grid .span-2 { grid-column: 1 / -1; }
    .ops-list {
      flex: 1 1 0;
      min-height: 0;
      overflow-y: auto;
      padding-right: 4px;
    }
    .ops-card {
      background: #0a0a0a;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .ops-card:hover {
      border-color: #525252;
      background: #161616;
    }
    .ops-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .ops-title {
      font-size: 12px;
      font-weight: 700;
      color: #f5f5f5;
      line-height: 1.4;
    }
    .ops-row {
      font-size: 11px;
      color: #a3a3a3;
      margin-top: 4px;
      line-height: 1.45;
    }
    .ops-row b {
      color: #d4d4d4;
      font-weight: 600;
    }
    .ops-links {
      display: flex;
      gap: 8px;
      margin-top: 6px;
      flex-wrap: wrap;
    }
    .ops-links a {
      font-size: 10px;
      font-weight: 700;
      color: #e5e5e5;
      text-decoration: none;
      border: 1px solid #404040;
      border-radius: 999px;
      padding: 2px 8px;
      background: #1a1a1a;
    }
    .ops-status {
      flex-shrink: 0;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid #525252;
      background: #1f1f1f;
      color: #e5e5e5;
      cursor: pointer;
    }
    .ops-empty {
      font-size: 12px;
      color: #737373;
      padding: 24px 8px;
      text-align: center;
    }
    .ops-page-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .ops-page-tab {
      flex: 1;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      padding: 8px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      background: transparent;
      color: #a3a3a3;
      cursor: pointer;
    }
    .ops-page-tab.active {
      background: #fff;
      color: #000;
      border-color: #fff;
    }
    .ops-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .ops-chip {
      font-size: 10px;
      font-weight: 700;
      padding: 6px 8px;
      border-radius: 999px;
      border: 1px solid #3f3f3f;
      background: #171717;
      color: #d4d4d4;
      cursor: pointer;
    }
    .ops-chip.active {
      background: #f5f5f5;
      color: #111;
      border-color: #f5f5f5;
    }
    .ops-amount-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 0 10px;
    }
    .ops-amount-wrap span {
      color: #a3a3a3;
      font-size: 12px;
      font-weight: 700;
    }
    .ops-amount-wrap input {
      border: 0;
      background: transparent;
      box-shadow: none;
      padding-left: 0;
    }

    .iframe-wrapper {
      width: 100%;
      height: 100%;
      border-radius: inherit;
      overflow: hidden;
      filter: contrast(0.98) saturate(1.05);
      transition: filter 0.35s ease;
    }
    .iframe-wrapper:hover { filter: contrast(1) saturate(1.08); }

    #cmd-palette-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 4, 12, 0.72);
      backdrop-filter: blur(10px);
      z-index: 100;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 15vh;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    #cmd-palette-overlay.active { opacity: 1; pointer-events: auto; }
    #cmd-palette {
      width: 100%;
      max-width: 520px;
      background: rgba(14, 16, 24, 0.92);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.65), 0 0 0 1px rgba(34,211,238,0.08);
      overflow: hidden;
      transform: scale(0.96) translateY(-8px);
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #cmd-palette-overlay.active #cmd-palette { transform: scale(1) translateY(0); }
    .cmd-item {
      padding: 12px 16px;
      color: #a1a1aa;
      font-size: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cmd-item.selected, .cmd-item:hover {
      background: rgba(34, 211, 238, 0.08);
      color: #fafafa;
    }

    /* Apps リンク一覧（右上）：4分割グリッド内で高さ制限＋この中だけスクロール */
    #panel-apps .app-panel-bg {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(ellipse at center, rgba(55, 55, 55, 0.32) 0%, #05060f 50%, #020208 100%);
      pointer-events: none;
      z-index: 0;
    }
    #panel-apps .app-panel-body {
      position: relative;
      z-index: 10;
      flex: 1 1 0;
      min-height: 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      padding: 10px 8px 10px 10px;
    }
    .apps-switch {
      display: flex;
      gap: 2px;
      border: 1px solid #444;
      padding: 2px;
      flex: none;
      margin-bottom: 10px;
      width: fit-content;
    }
    .apps-switch button {
      border: 0;
      background: transparent;
      color: #888;
      padding: 7px 16px;
      font-size: 11px;
      letter-spacing: 0.14em;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      cursor: pointer;
    }
    .apps-switch button.on {
      background: #fff;
      color: #000;
    }
    #app-list.app-link-grid {
      flex: 1 1 0;
      min-height: 0;
      min-width: 0;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 8px;
      align-content: start;
      padding-right: 4px;
      scrollbar-width: auto;
      scrollbar-color: rgba(180, 180, 180, 0.55) rgba(255, 255, 255, 0.08);
    }
    #panel-apps[data-view="tax"] #app-list { display: none; }
    #panel-apps[data-view="link"] .tax-desk { display: none; }
    .tax-desk {
      flex: 1 1 0;
      min-height: 0;
      margin-top: 0;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 12px 12px 10px;
      background: rgba(0,0,0,0.35);
      display: flex;
      flex-direction: column;
      overflow: auto;
    }
    .tax-desk-title {
      font-size: 11px;
      letter-spacing: 0.22em;
      font-weight: 600;
      color: #fff;
      margin-bottom: 10px;
    }
    .tax-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .tax-chip {
      flex: 1;
      border: 1px solid rgba(255,255,255,0.16);
      background: transparent;
      color: #a3a3a3;
      border-radius: 999px;
      padding: 7px 8px;
      font-size: 11px;
      cursor: pointer;
    }
    .tax-chip.on {
      background: #fff;
      color: #000;
      border-color: #fff;
    }
    .tax-desk input[type="text"] {
      width: 100%;
      background: #000;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 10px;
      color: #fff;
      font-size: 18px;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      padding: 10px 12px;
      outline: none;
      margin-bottom: 10px;
    }
    .tax-out {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }
    .tax-out div {
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 10px;
      padding: 8px;
    }
    .tax-out span {
      display: block;
      font-size: 10px;
      color: #888;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }
    .tax-out b {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
    }
    .tax-copy {
      border: 1px solid #fff;
      background: transparent;
      color: #fff;
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 11px;
      cursor: pointer;
      width: 100%;
    }
    #app-list.app-link-grid::-webkit-scrollbar {
      width: 12px;
    }
    #app-list.app-link-grid::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.07);
      border-radius: 999px;
      margin: 6px 2px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    #app-list.app-link-grid::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, rgba(235, 235, 235, 0.55), rgba(145, 145, 145, 0.5));
      border-radius: 999px;
      border: 3px solid rgba(8, 10, 18, 0.95);
      min-height: 40px;
    }
    #app-list.app-link-grid::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, rgba(245, 245, 245, 0.85), rgba(180, 180, 180, 0.75));
    }
    #app-list.app-link-grid::-webkit-scrollbar-thumb:active {
      background: linear-gradient(180deg, rgba(255, 255, 255, 1), rgba(190, 190, 190, 0.9));
    }
    .app-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      min-width: 0;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 10px 10px;
      transition: border-color 0.2s, background 0.2s;
      animation: app-row-appear 0.35s ease both;
    }
    .app-row:hover {
      border-color: rgba(255,255,255,0.28);
      background: rgba(255,255,255,0.07);
    }
    .app-link {
      color: #e5e7eb;
      text-decoration: none;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
      position: relative;
      z-index: 1;
    }
    .app-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      flex-shrink: 0;
      box-shadow: 0 0 12px currentColor;
      opacity: 0.95;
    }
    .app-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .app-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .app-mini-btn {
      font-size: 10px;
      font-weight: 700;
      color: #e5e7eb;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.26);
      border-radius: 999px;
      padding: 2px 8px;
      text-decoration: none;
    }
    .app-keycap {
      font-size: 10px;
      font-family: 'Outfit', sans-serif;
      letter-spacing: 0.08em;
      color: #111;
      background: #fff;
      border: 1px solid #fff;
      border-radius: 999px;
      padding: 1px 7px;
      font-weight: 700;
    }
    @keyframes app-row-appear {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .mascot-wrapper {
      width: 68px;
      height: 68px;
      transform-origin: bottom center;
      filter: drop-shadow(0 12px 16px rgba(0,0,0,0.65));
    }
    @keyframes mascot-squish {
      0%, 100% { transform: scale(1, 1); }
      50% { transform: scale(1.04, 0.96); }
    }
    @keyframes mascot-jump {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      30% { transform: translateY(-56px) scale(0.92, 1.08); }
      50% { transform: translateY(-64px) scale(0.96, 1.04); }
      70% { transform: translateY(-56px) scale(1, 1); }

  <script>
    const SCHEDULE_URL = 'https://calendar.app.google/egS9bVik7BJTZ8Jb9';

    const apps = [
      { category: 'core', key: 'd', name: 'SHEET', url: 'https://docs.google.com/spreadsheets/d/1deuG2zYdIMegMnCCT7lVl4AD7J75K8KisEsH2NVH10Q/edit', color: 0xffffff },

      { category: 'core', key: '2', name: 'CHAT', url: 'https://mail.google.com/mail/u/0/#chat/home', color: 0x33ccff },
      { category: 'core', key: 'o', name: 'TOP', url: 'https://sites.google.com/okamoto-group.co.jp/top2020/top%E3%83%9A%E3%83%BC%E3%82%B8', color: 0xffaa00 },
      { category: 'ops', key: 'h', name: 'HomePage', url: 'https://joyfit.jp/kyodo/wp-login.php', color: 0xff5555 },

      { category: 'ops', key: 's', name: '稟議申請', url: 'https://www.appsheet.com/start/091d2146-ac0b-4c3a-9962-84e071dc23e1', color: 0xffdd00 },
      { category: 'tools', key: 'p', name: 'PT', url: 'https://reserve.joyfit.jp/', color: 0xff6600 },
      { category: 'tools', key: 'q', name: 'Querier', url: 'https://app.querier.io/', color: 0x8888ff }
    ];

    function renderAppLinks() {
      const list = document.getElementById('app-list');
      if (!list) return;
      list.innerHTML = '';

      apps.forEach(function (app, idx) {
        const row = document.createElement('div');
        row.className = 'app-row';
        row.setAttribute('role', 'listitem');
        row.style.animationDelay = (idx * 0.02) + 's';

        const colorHex = '#d4d4d8';
        const link = document.createElement('a');
        link.className = 'app-link';
        link.href = app.url;
        link.target = app.url.indexOf('http') === 0 ? '_blank' : '_self';
        link.rel = 'noopener noreferrer';
        link.innerHTML =
          '<span class="app-dot" style="color:' + colorHex + '; background:' + colorHex + ';"></span>' +
          '<span class="app-name">' + app.name + '</span>';

        const actions = document.createElement('div');
        actions.className = 'app-actions';
        if (app.name === 'MAIL') {
          actions.innerHTML += '<span id="mail-badge" class="app-keycap" style="display:none;">0</span>';
        }
        if (app.name === 'PT') {
          actions.innerHTML += '<a class="app-mini-btn" href="' + SCHEDULE_URL + '" target="_blank" rel="noopener noreferrer">空き</a>';
        }
        if (app.key) {
          actions.innerHTML += '<span class="app-keycap">' + app.key.toUpperCase() + '</span>';
        }

        row.appendChild(link);
        row.appendChild(actions);
        list.appendChild(row);
      });
    }

    let mascotTimerId = null;
    let mascotStartTime = 0;
    let mascotElapsedTime = 0;
    let mascotState = 'idle';
    let taxMode = 'gross';
    let taxRate = 10;
    const DEFAULT_GYOMU_LINES = ['清掃業務', 'お客様対応', '事務作業'];

    function formatMascotTime(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function updateMascotBubble() {
      const bubble = document.getElementById('mascot-bubble');
      if (mascotState === 'idle') {
        bubble.classList.remove('scale-100', 'opacity-100');
        bubble.classList.add('scale-95', 'opacity-0');
        setTimeout(function () { if (mascotState === 'idle') bubble.classList.add('hidden'); }, 200);
      } else if (mascotState === 'running') {
        bubble.classList.remove('hidden');
        setTimeout(function () {
          bubble.classList.remove('scale-95', 'opacity-0');
          bubble.classList.add('scale-100', 'opacity-100');
        }, 10);
        const currentElapsed = Date.now() - mascotStartTime;
        bubble.innerHTML = '<span class="font-mono text-[14px] font-semibold text-zinc-200">' + formatMascotTime(currentElapsed) + '</span>';
      } else if (mascotState === 'stopped') {
        bubble.classList.remove('hidden', 'scale-95', 'opacity-0');
        bubble.classList.add('scale-100', 'opacity-100');
        const timeStr = formatMascotTime(mascotElapsedTime);
        bubble.innerHTML =
          '<div class="flex flex-col items-center gap-1">' +
          '<span class="text-[9px] text-zinc-300 font-bold tracking-wider uppercase">Measured</span>' +
          '<span class="font-mono text-[14px] font-semibold text-zinc-100 leading-none mb-1">' + timeStr + '</span>' +
          '<button type="button" onclick="resetMascotTimer(event)" class="text-[10px] font-bold bg-white/10 text-zinc-200 px-3 py-1 rounded-lg border border-white/25 hover:bg-white/20 transition-colors">RESET</button>' +
          '</div>';
      }
    }

    function handleMascotClick() {
      const mascot = document.getElementById('ai-mascot');
      if (!mascot) return;
      if (mascotState === 'idle') {
        mascotStartTime = Date.now();
        mascotState = 'running';
        mascotTimerId = setInterval(updateMascotBubble, 1000);
        updateMascotBubble();
        mascot.classList.add('mascot-fast');
        mascot.classList.remove('mascot-sleeping');
        mascot.style.animation = '';
      } else if (mascotState === 'running') {
        clearInterval(mascotTimerId);
        mascotElapsedTime = Date.now() - mascotStartTime;
        mascotState = 'stopped';
        updateMascotBubble();
        mascot.classList.remove('mascot-fast');
      }
    }

    function resetMascotTimer(e) {
      e.stopPropagation();
      mascotState = 'idle';
      mascotElapsedTime = 0;
      updateMascotBubble();
    }

    function formatYen(value) {
      return Number(value || 0).toLocaleString('ja-JP');
    }

    function calcTaxView() {
      var input = document.getElementById('tax-input');
      var netEl = document.getElementById('tax-net');
      var taxEl = document.getElementById('tax-tax');
      var grossEl = document.getElementById('tax-gross');
      if (!input || !netEl || !taxEl || !grossEl) return;
      var v = Number(String(input.value || '').replace(/[^\d.]/g, ''));
      if (!Number.isFinite(v) || v < 0) v = 0;

      var net = 0;
      var gross = 0;
      var tax = 0;
      if (taxMode === 'gross') {
        gross = Math.floor(v);
        net = Math.floor(gross / (1 + taxRate / 100));
        tax = gross - net;
      } else {
        net = Math.floor(v);
        tax = Math.floor(net * taxRate / 100);
        gross = net + tax;
      }
      netEl.textContent = formatYen(net);
      taxEl.textContent = formatYen(tax);
      grossEl.textContent = formatYen(gross);
    }

    function setTaxMode(nextMode) {
      taxMode = nextMode;
      var b1 = document.getElementById('tax-mode-gross');
      var b2 = document.getElementById('tax-mode-net');
      if (b1) b1.classList.toggle('on', nextMode === 'gross');
      if (b2) b2.classList.toggle('on', nextMode === 'net');
      calcTaxView();
    }

    function setTaxRate(nextRate) {
      taxRate = nextRate;
      var r8 = document.getElementById('tax-rate-8');
      var r10 = document.getElementById('tax-rate-10');
      if (r8) r8.classList.toggle('on', nextRate === 8);
      if (r10) r10.classList.toggle('on', nextRate === 10);
      calcTaxView();
    }

    var APPS_VIEW_KEY = 'ryuta_pro_apps_view_v1';

    function applyAppsView(view) {
      var panel = document.getElementById('panel-apps');
      var btnLink = document.getElementById('apps-view-link');
      var btnTax = document.getElementById('apps-view-tax');
      if (!panel) return;
      var next = view === 'tax' ? 'tax' : 'link';
      panel.setAttribute('data-view', next);
      if (btnLink) btnLink.classList.toggle('on', next === 'link');
      if (btnTax) btnTax.classList.toggle('on', next === 'tax');
      try { localStorage.setItem(APPS_VIEW_KEY, next); } catch (e) {}
    }

    function setupAppsViewSwitch() {
      var btnLink = document.getElementById('apps-view-link');
      var btnTax = document.getElementById('apps-view-tax');
      var saved = 'link';
      try { saved = localStorage.getItem(APPS_VIEW_KEY) || 'link'; } catch (e) {}
      applyAppsView(saved);
      if (btnLink) btnLink.addEventListener('click', function () { applyAppsView('link'); });
      if (btnTax) btnTax.addEventListener('click', function () { applyAppsView('tax'); });
    }

    function setupTaxMascot() {
      var input = document.getElementById('tax-input');
      var modeGross = document.getElementById('tax-mode-gross');
      var modeNet = document.getElementById('tax-mode-net');
      var rate8 = document.getElementById('tax-rate-8');
      var rate10 = document.getElementById('tax-rate-10');
      var copyBtn = document.getElementById('tax-copy');
      if (!input) return;
      input.addEventListener('input', calcTaxView);
      if (modeGross) modeGross.addEventListener('click', function () { setTaxMode('gross'); });
      if (modeNet) modeNet.addEventListener('click', function () { setTaxMode('net'); });
      if (rate8) rate8.addEventListener('click', function () { setTaxRate(8); });
      if (rate10) rate10.addEventListener('click', function () { setTaxRate(10); });
      if (copyBtn) {
        copyBtn.addEventListener('click', function () {
          var text = '税抜 ' + document.getElementById('tax-net').textContent +
            ' / 消費税 ' + document.getElementById('tax-tax').textContent +
            ' / 税込 ' + document.getElementById('tax-gross').textContent +
            '（' + taxRate + '%）';
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text);
          }
          copyBtn.textContent = 'コピーした';
          setTimeout(function () { copyBtn.textContent = '結果をコピー'; }, 1200);
        });
      }
      setTaxMode('gross');
      setTaxRate(10);
      calcTaxView();
    }

    function setupAiMascotClick() {
      var mascot = document.getElementById('ai-mascot');
      if (!mascot) return;
      mascot.addEventListener('click', function (e) {
        e.stopPropagation();
        handleMascotClick();
      });
    }

    function randomMascotAction() {
      const mascot = document.getElementById('ai-mascot');
      if (!mascot || mascot.classList.contains('mascot-thinking') || mascotState === 'running') {
        setTimeout(randomMascotAction, 2000);
        return;
      }
      const actions = ['sleep', 'squish', 'squish', 'squish'];
      const action = actions[Math.floor(Math.random() * actions.length)];
      mascot.classList.remove('mascot-sleeping');
      void mascot.offsetWidth;
      if (action === 'sleep') {
        mascot.classList.add('mascot-sleeping');
        mascot.style.animation = 'mascot-squish 4s infinite ease-in-out';
      } else mascot.style.animation = 'mascot-squish 2.5s infinite ease-in-out';
      const nextDelay = action === 'sleep' ? 6000 : (Math.random() * 3000 + 2000);
      setTimeout(randomMascotAction, nextDelay);
    }

    let activeTasks = JSON.parse(localStorage.getItem('ryuta_pro_active') || '[]');
    let finishedTasks = JSON.parse(localStorage.getItem('ryuta_pro_done') || '[]');
    let kansouText = localStorage.getItem('ryuta_pro_kansou') || '';

    /** 業務欄は下書きがあればそれを優先。なければ Done から箇条書き。感想は前回入力を復元 */
    function openKansouModal() {
      var gy = document.getElementById('kansou-gyomu-input');
      var hn = document.getElementById('kansou-hannou-input');
      var ta = document.getElementById('kansou-input');
      var draftG = '';
      try {
        draftG = localStorage.getItem('ryuta_pro_kansou_gyomu_draft') || '';
      } catch (e) {}
      if (gy) {
        if (draftG.trim()) {
          gy.value = draftG;
        } else if (finishedTasks.length) {
          gy.value = finishedTasks.map(function (t) { return '・' + t; }).join('\n');
        } else {
          gy.value = '';
        }
      }
      if (hn) {
        hn.value = localStorage.getItem('ryuta_pro_kansou_hannou') || '';
      }
      if (ta) ta.value = kansouText;
      var ov = document.getElementById('kansou-modal-overlay');
      if (ov) {
        ov.classList.add('active');
        setTimeout(function () { if (hn) hn.focus(); }, 100);
      }
    }

    /** API なし：業務メモと感想を見出し付きでつなぐだけ */
    function mergePlainKansou() {
      var g = document.getElementById('kansou-gyomu-input');
      var h = document.getElementById('kansou-hannou-input');
      var out = document.getElementById('kansou-input');
      if (!g || !h || !out) return;
      var gy = g.value.trim();
      var hn = h.value.trim();
      if (!hn) {
        window.alert('所感を入力してください。');
        return;
      }
      // 所感欄には「所感」のみを入れる（業務内容は重複させない）
      out.value = hn;
      try {
        localStorage.setItem('ryuta_pro_kansou_hannou', hn);
        localStorage.setItem('ryuta_pro_kansou_gyomu_draft', gy);
      } catch (e) {}
    }

    function closeKansouModal() {
      var ov = document.getElementById('kansou-modal-overlay');
      if (ov) ov.classList.remove('active');
    }

    function saveKansouAndClose() {
      var ta = document.getElementById('kansou-input');
      var hn = document.getElementById('kansou-hannou-input');
      var gy = document.getElementById('kansou-gyomu-input');
      kansouText = ta ? ta.value.trim() : '';
      localStorage.setItem('ryuta_pro_kansou', kansouText);
      try {
        if (hn) localStorage.setItem('ryuta_pro_kansou_hannou', hn.value.trim());
        if (gy) localStorage.setItem('ryuta_pro_kansou_gyomu_draft', gy.value.trim());
      } catch (e) {}
      closeKansouModal();
    }

    function polishDailyKansou() {
      var gy = document.getElementById('gyomu-main-input');
      var ks = document.getElementById('kansou-main-input');
      var btn = document.getElementById('btn-polish-daily');
      var kansou = ks ? String(ks.value || '').trim() : '';
      if (!kansou) {
        window.alert('先に所感を入力してください。');
        return;
      }
      if (btn) {
        btn.disabled = true;
        btn.textContent = '添削中…';
      }
      fetch('/api/polish', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          gyomu: gy ? String(gy.value || '') : '',
          kansou: kansou
        })
      })
        .then(function (r) {
          return r.text().then(function (raw) {
            var res = null;
            try {
              res = raw ? JSON.parse(raw) : null;
            } catch (e) {
              throw new Error(
                'サーバー応答の解析に失敗しました。しばらくして再試行してください。\n' +
                  String(raw || '').slice(0, 120)
              );
            }
            if (!r.ok && !(res && res.message)) {
              throw new Error('添削に失敗しました（HTTP ' + r.status + '）');
            }
            return res;
          });
        })
        .then(function (res) {
          if (btn) {
            btn.disabled = false;
            btn.textContent = '添削';
          }
          if (res && res.ok && res.text) {
            if (ks) ks.value = res.text;
            autosaveDailyNow_();
            return;
          }
          window.alert((res && res.message) || '添削に失敗しました。');
        })
        .catch(function (err) {
          if (btn) {
            btn.disabled = false;
            btn.textContent = '添削';
          }
          window.alert('エラー: ' + (err && err.message ? err.message : String(err)));
        });
    }

    function polishKansouAI() {
      var ta = document.getElementById('kansou-input');
      if (!ta || !ta.value.trim()) {
        window.alert('先に所感を入力してください。');
        return;
      }
      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        window.alert('Web アプリで開いたときだけ使えます。');
        return;
      }
      var btn = document.getElementById('btn-polish-kansou');
      if (btn) {
        btn.disabled = true;
        btn.textContent = '…';
      }
      google.script.run
        .withSuccessHandler(function (r) {
          if (btn) {
            btn.disabled = false;
            btn.textContent = 'AIで整える';
          }
          if (r && r.ok) ta.value = r.text;
          else window.alert((r && r.message) || '校閲に失敗しました。');
        })
        .withFailureHandler(function (err) {
          if (btn) {
            btn.disabled = false;
            btn.textContent = 'AIで整える';
          }
          window.alert('エラー: ' + (err && err.message ? err.message : String(err)));
        })
        .polishKansouWithGemini(ta.value);
    }

    function setSyncStatus(text, kind) {
      const el = document.getElementById('sync-status') || document.getElementById('sync-status-brand');
      if (!el) return;
      el.textContent = text === 'LOCAL' ? '' : text;
      el.className = (el.id === 'sync-status-brand' ? 'brand-save' : 'sync-pill') + (kind === 'ok' ? ' ok' : kind === 'err' ? ' err' : '');
    }

    function processInputWithoutAI(text) {
      if (!text || !text.trim()) return;
      const input = document.getElementById('task-input');
      const mascot = document.getElementById('ai-mascot');
      if (!input) return;
      input.disabled = true;
      input.value = '…';
      input.classList.add('ai-loading');
      if (mascot) {
        mascot.classList.remove('mascot-sleeping');
        mascot.classList.add('mascot-thinking');
      }
      setTimeout(function () {
        activeTasks.push(text.trim());
        saveTasks();
        renderTasks();
        const container = document.getElementById('task-container-inbox');
        if (container) {
          setTimeout(function () { container.scrollTop = container.scrollHeight; }, 50);
        }
        input.disabled = false;
        input.value = '';
        input.classList.remove('ai-loading');
        if (mascot) mascot.classList.remove('mascot-thinking');
        setTimeout(function () { input.focus(); }, 50);
      }, 600);
    }

    var taskInputEl = document.getElementById('task-input');
    if (taskInputEl) {
      taskInputEl.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') processInputWithoutAI(this.value);
      });
    }

    function renderTasks() {
      const inboxContainer = document.getElementById('task-container-inbox');
      const doneContainer = document.getElementById('task-container-done');
      if (!inboxContainer || !doneContainer) return;
      inboxContainer.innerHTML = '';
      activeTasks.forEach(function (task, index) {
        const div = document.createElement('div');
        div.className = 'task-card';
        div.innerHTML =
          '<div class="task-checkbox" onclick="completeTask(' + index + ')"></div>' +
          '<div class="flex-1 text-xs text-zinc-300 outline-none leading-relaxed" contenteditable="true" onblur="editTask(event, \'active\', ' + index + ')" onkeydown="handleTaskEditKey(event)">' +
          escapeHtml(task) + '</div>';
        inboxContainer.appendChild(div);
      });
      doneContainer.innerHTML = '';
      finishedTasks.forEach(function (task, index) {
        const div = document.createElement('div');
        div.className = 'task-card done-card';
        div.innerHTML =
          '<div class="task-checkbox done" onclick="undoTask(' + index + ')"></div>' +
          '<div class="flex-1 text-xs text-zinc-500 line-through outline-none leading-relaxed" contenteditable="true" onblur="editTask(event, \'done\', ' + index + ')" onkeydown="handleTaskEditKey(event)">' +
          escapeHtml(task) + '</div>';
        doneContainer.appendChild(div);
      });
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function editTask(event, type, index) {
      const newText = event.target.textContent.trim();
      if (newText === '') {
        if (type === 'active') activeTasks.splice(index, 1);
        else finishedTasks.splice(index, 1);
      } else {
        if (type === 'active') activeTasks[index] = newText;
        else finishedTasks[index] = newText;
      }
      saveTasks();
      renderTasks();
    }

    function handleTaskEditKey(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        event.target.blur();
      }
    }

    function completeTask(index) {
      finishedTasks.push(activeTasks.splice(index, 1)[0]);
      saveTasks();
      renderTasks();
    }

    function undoTask(index) {
      activeTasks.push(finishedTasks.splice(index, 1)[0]);
      saveTasks();
      renderTasks();
    }

    function saveTasks() {
      localStorage.setItem('ryuta_pro_active', JSON.stringify(activeTasks));
      localStorage.setItem('ryuta_pro_done', JSON.stringify(finishedTasks));
    }

    function normalizeGyomuLine_(line) {
      return String(line || '')
        .replace(/^[・\-•\s]+/, '')
        .trim();
    }

    function parseGyomuLines_(raw) {
      if (!raw) return [];
      return String(raw)
        .replace(/\r\n/g, '\n')
        .split('\n')
        .map(normalizeGyomuLine_)
        .filter(function (v) { return !!v; });
    }

    var TODO_LEGACY_KEY = 'ryuta_pro_memo_todos_v1';
    var TODO_KEY = 'ryuta_pro_personal_tasks_v1';
    var TODO_MIGRATED_KEY = 'ryuta_pro_personal_tasks_migrated_v1';
    var TODO_BUCKETS = [
      { id: 'today', label: '今日' },
      { id: 'week', label: '今週' },
      { id: 'month', label: '今月' },
      { id: 'waiting', label: '返答待ち' },
      { id: 'followup', label: '継続確認' },
      { id: 'done', label: '完了' },
    ];
    var personalTasks = [];
    var todoBucket = 'today';
    var todoEditId = '';
    var personalSaveTimers = {};
    var todayEvents = [];

    function todayKey_() {
      try {
        return new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Tokyo' });
      } catch (e) {
        var d = new Date();
        var m = String(d.getMonth() + 1);
        var day = String(d.getDate());
        if (m.length < 2) m = '0' + m;
        if (day.length < 2) day = '0' + day;
        return d.getFullYear() + '-' + m + '-' + day;
      }
    }

    function newTaskId_() {
      return 't_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
    }

    function ymdToDate_(ymd) {
      var parts = String(ymd || '').split('-');
      return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    }

    function dateToYmd_(d) {
      var m = String(d.getMonth() + 1);
      var day = String(d.getDate());
      if (m.length < 2) m = '0' + m;
      if (day.length < 2) day = '0' + day;
      return d.getFullYear() + '-' + m + '-' + day;
    }

    function weekMondayYmd_(ymd) {
      var d = ymdToDate_(ymd);
      var day = d.getDay();
      var diff = day === 0 ? -6 : 1 - day;
      d.setDate(d.getDate() + diff);
      return dateToYmd_(d);
    }

    function weekSundayYmd_(ymd) {
      var d = ymdToDate_(weekMondayYmd_(ymd));
      d.setDate(d.getDate() + 6);
      return dateToYmd_(d);
    }

    function monthEndYmd_(ymd) {
      var parts = String(ymd || '').split('-');
      return dateToYmd_(new Date(Number(parts[0]), Number(parts[1]), 0));
    }

    function personalPeriodKey_(bucket, ymd) {
      if (bucket === 'today') return ymd;
      if (bucket === 'week') return 'W' + weekMondayYmd_(ymd);
      if (bucket === 'month') return String(ymd).slice(0, 7);
      return '';
    }

    function personalCarryDue_(bucket, due, ymd) {
      if (due && due >= ymd) return due;
      if (bucket === 'today') return ymd;
      if (bucket === 'week') return weekSundayYmd_(ymd);
      if (bucket === 'month') return monthEndYmd_(ymd);
      return due || '';
    }

    function normalizeClientTask_(raw) {
      var ymd = todayKey_();
      var bucket = String((raw && raw.bucket) || 'today');
      if (!{ today: 1, week: 1, month: 1, waiting: 1, followup: 1 }[bucket]) bucket = 'today';
      var pri = String((raw && raw.priority) || 'mid');
      if (pri !== 'high' && pri !== 'low') pri = 'mid';
      var status = (raw && raw.status) === 'done' || (raw && raw.done) ? 'done' : 'open';
      var title = String((raw && (raw.title || raw.text)) || '').trim();
      return {
        id: String((raw && raw.id) || '') || newTaskId_(),
        title: title,
        bucket: bucket,
        due_date: String((raw && raw.due_date) || '').trim(),
        priority: pri,
        url: String((raw && raw.url) || '').trim(),
        status: status,
        done_at: status === 'done' ? String((raw && (raw.done_at || raw.doneDate)) || ymd) : '',
        created_at: String((raw && raw.created_at) || ''),
        updated_at: String((raw && raw.updated_at) || ''),
        note: String((raw && raw.note) || ''),
        period_key: String((raw && raw.period_key) || '') || personalPeriodKey_(bucket, ymd),
      };
    }

    function carryPersonalTask_(t, ymd) {
      if (!t || t.status === 'done') return false;
      if (t.bucket !== 'today' && t.bucket !== 'week' && t.bucket !== 'month') return false;
      var nextKey = personalPeriodKey_(t.bucket, ymd);
      var due = String(t.due_date || '');
      var dueStale = due && due < ymd;
      var keyStale = t.period_key !== nextKey;
      if (!keyStale && !dueStale) return false;
      t.period_key = nextKey;
      t.due_date = personalCarryDue_(t.bucket, due, ymd);
      t.updated_at = new Date().toISOString();
      return true;
    }

    function loadPersonalTasksLocal_() {
      try {
        var v = JSON.parse(localStorage.getItem(TODO_KEY) || '[]');
        personalTasks = Array.isArray(v) ? v.map(normalizeClientTask_) : [];
      } catch (e) {
        personalTasks = [];
      }
    }

    function savePersonalTasksLocal_() {
      try {
        localStorage.setItem(TODO_KEY, JSON.stringify(personalTasks));
      } catch (e) {}
    }

    function migrateMemoTodos_() {
      try {
        if (localStorage.getItem(TODO_MIGRATED_KEY)) return;
        if (personalTasks.length) {
          localStorage.setItem(TODO_MIGRATED_KEY, '1');
          return;
        }
        var old = JSON.parse(localStorage.getItem(TODO_LEGACY_KEY) || '[]');
        if (Array.isArray(old) && old.length) {
          personalTasks = old.map(function (t) {
            return normalizeClientTask_({
              id: t && t.id,
              title: t && t.text,
              bucket: 'today',
              status: t && t.done ? 'done' : 'open',
              done_at: t && t.doneDate,
            });
          }).filter(function (t) { return !!t.title; });
          savePersonalTasksLocal_();
        }
        localStorage.setItem(TODO_MIGRATED_KEY, '1');
      } catch (e) {}
    }

    function findPersonalTask_(id) {
      for (var i = 0; i < personalTasks.length; i++) {
        if (personalTasks[i].id === id) return personalTasks[i];
      }
      return null;
    }

    function persistPersonalTask_(task) {
      savePersonalTasksLocal_();
      var id = task.id;
      clearTimeout(personalSaveTimers[id]);
      personalSaveTimers[id] = setTimeout(function () {
        setSyncStatus('…', '');
        fetch('/api/tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'upsert', task: task }),
        })
          .then(function (r) { return r.json(); })
          .then(function (res) {
            if (res && res.ok) setSyncStatus('SHEET', 'ok');
            else setSyncStatus('TODO×', 'err');
          })
          .catch(function () { setSyncStatus('TODO×', 'err'); });
      }, 400);
    }

    function queueDeletePersonalTask_(id) {
      setSyncStatus('…', '');
      fetch('/api/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'delete', id: id }),
      })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res && res.ok) setSyncStatus('SHEET', 'ok');
          else setSyncStatus('TODO×', 'err');
        })
        .catch(function () { setSyncStatus('TODO×', 'err'); });
    }

    function bucketCount_(id) {
      return personalTasks.filter(function (t) {
        if (id === 'done') return t.status === 'done';
        return t.status !== 'done' && t.bucket === id;
      }).length;
    }

    function visiblePersonalTasks_() {
      var list = personalTasks.filter(function (t) {
        if (todoBucket === 'done') return t.status === 'done';
        return t.status !== 'done' && t.bucket === todoBucket;
      });
      var pri = { high: 0, mid: 1, low: 2 };
      list.sort(function (a, b) {
        var pa = pri[a.priority] != null ? pri[a.priority] : 1;
        var pb = pri[b.priority] != null ? pri[b.priority] : 1;
        if (pa !== pb) return pa - pb;
        return String(a.due_date || '9999').localeCompare(String(b.due_date || '9999'));
      });
      return list;
    }

    function priLabel_(p) {
      if (p === 'high') return '高';
      if (p === 'low') return '低';
      return '中';
    }

    function formatDue_(ymd) {
      if (!ymd) return '';
      var p = String(ymd).split('-');
      if (p.length < 3) return ymd;
      return Number(p[1]) + '/' + Number(p[2]);
    }

    function renderTodoBuckets() {
      var box = document.getElementById('todo-buckets');
      if (!box) return;
      box.innerHTML = TODO_BUCKETS.map(function (b) {
        return '<button type="button" class="todo-bucket' + (todoBucket === b.id ? ' on' : '') + '" data-bucket="' + b.id + '">' +
          escapeHtml(b.label) +
          '<span class="n">' + bucketCount_(b.id) + '</span>' +
          '</button>';
      }).join('');
    }

    function renderMemoTodos() {
      renderTodoBuckets();
      renderTodayPanel();
      var box = document.getElementById('todo-list');
      if (!box) return;
      var list = visiblePersonalTasks_();
      if (!list.length) {
        box.innerHTML = '<div class="todo-empty">この分類にタスクはありません。</div>';
        return;
      }
      var today = todayKey_();
      box.innerHTML = list.map(function (t) {
        var overdue = t.status !== 'done' && t.due_date && t.due_date < today;
        var sub = [];
        if (t.due_date) sub.push('<span class="' + (overdue ? 'todo-overdue' : '') + '">' + escapeHtml(formatDue_(t.due_date)) + '</span>');
        sub.push('<span class="todo-pri-' + escapeHtml(t.priority) + '">' + priLabel_(t.priority) + '</span>');
        if (t.url) sub.push('<a href="' + escapeHtml(t.url) + '" target="_blank" rel="noopener noreferrer">URL</a>');
        var body = '<div class="todo-item-title" data-edit="' + escapeHtml(t.id) + '">' + escapeHtml(t.title) + '</div>' +
          '<div class="todo-item-sub">' + sub.join('') + '</div>';
        if (todoEditId === t.id && t.status !== 'done') {
          body += '<div class="todo-edit">' +
            '<input type="text" data-field="title" data-id="' + escapeHtml(t.id) + '" value="' + escapeHtml(t.title) + '" maxlength="200">' +
            '<input type="date" data-field="due_date" data-id="' + escapeHtml(t.id) + '" value="' + escapeHtml(t.due_date || '') + '">' +
            '<select data-field="priority" data-id="' + escapeHtml(t.id) + '">' +
              '<option value="high"' + (t.priority === 'high' ? ' selected' : '') + '>高</option>' +
              '<option value="mid"' + (t.priority === 'mid' ? ' selected' : '') + '>中</option>' +
              '<option value="low"' + (t.priority === 'low' ? ' selected' : '') + '>低</option>' +
            '</select>' +
            '<input type="url" data-field="url" data-id="' + escapeHtml(t.id) + '" value="' + escapeHtml(t.url || '') + '" placeholder="関連URL" maxlength="500" style="grid-column:1/-1">' +
            '</div>';
        }
        return '<div class="todo-item' + (t.status === 'done' ? ' done' : '') + '">' +
          '<input type="checkbox" data-todo="' + escapeHtml(t.id) + '"' + (t.status === 'done' ? ' checked' : '') + '>' +
          '<div>' + body + '</div>' +
          '<button type="button" class="todo-del" data-del="' + escapeHtml(t.id) + '" title="削除">×</button>' +
          '</div>';
      }).join('');
    }

    function addMemoTodo() {
      var input = document.getElementById('todo-input');
      var text = input ? String(input.value || '').trim() : '';
      if (!text) return;
      var dueEl = document.getElementById('todo-due');
      var priEl = document.getElementById('todo-priority');
      var urlEl = document.getElementById('todo-url');
      var bucket = todoBucket === 'done' ? 'today' : todoBucket;
      var task = normalizeClientTask_({
        title: text,
        bucket: bucket,
        due_date: dueEl ? dueEl.value : '',
        priority: priEl ? priEl.value : 'mid',
        url: urlEl ? urlEl.value : '',
        status: 'open',
      });
      personalTasks.unshift(task);
      if (input) input.value = '';
      if (urlEl) urlEl.value = '';
      persistPersonalTask_(task);
      renderMemoTodos();
    }

    function toggleMemoTodo(id, checked) {
      var t = findPersonalTask_(id);
      if (!t) return;
      t.status = checked ? 'done' : 'open';
      t.done_at = t.status === 'done' ? todayKey_() : '';
      persistPersonalTask_(t);
      renderMemoTodos();
      if (t.status === 'done') addGyomuLine_(t.title);
      else removeGyomuLine_(t.title);
    }

    function removeMemoTodo(id) {
      var t = findPersonalTask_(id);
      if (t && t.status === 'done' && t.done_at === todayKey_()) removeGyomuLine_(t.title);
      personalTasks = personalTasks.filter(function (x) { return x.id !== id; });
      savePersonalTasksLocal_();
      queueDeletePersonalTask_(id);
      if (todoEditId === id) todoEditId = '';
      renderMemoTodos();
    }

    function updatePersonalField_(id, field, value) {
      var t = findPersonalTask_(id);
      if (!t) return;
      if (field === 'title') {
        t.title = String(value || '').trim();
        if (!t.title) return;
      } else if (field === 'due_date') {
        t.due_date = String(value || '').trim();
      } else if (field === 'priority') {
        t.priority = value === 'high' || value === 'low' ? value : 'mid';
      } else if (field === 'url') {
        t.url = String(value || '').trim();
      } else {
        return;
      }
      persistPersonalTask_(t);
      renderMemoTodos();
    }

    function applyTodayTodosToGyomu_() {
      var today = todayKey_();
      personalTasks.forEach(function (t) {
        if (t && t.status === 'done' && t.done_at === today) addGyomuLine_(t.title);
      });
    }

    function addGyomuLine_(line) {
      var n = normalizeGyomuLine_(line);
      if (!n) return;
      var gy = document.getElementById('gyomu-main-input');
      if (!gy) return;
      var lines = parseGyomuLines_(gy.value);
      if (lines.indexOf(n) === -1) {
        lines.push(n);
        gy.value = lines.join('\n');
        autosaveDailyNow_();
      }
    }

    function removeGyomuLine_(line) {
      var n = normalizeGyomuLine_(line);
      var gy = document.getElementById('gyomu-main-input');
      if (!gy || !n) return;
      gy.value = parseGyomuLines_(gy.value).filter(function (x) { return x !== n; }).join('\n');
      autosaveDailyNow_();
    }

    function renderTodayPanel() {
      var dateEl = document.getElementById('today-date');
      if (dateEl) {
        try {
          dateEl.textContent = new Date().toLocaleDateString('ja-JP', {
            timeZone: 'Asia/Tokyo',
            month: 'numeric',
            day: 'numeric',
            weekday: 'short',
          });
        } catch (e) {
          dateEl.textContent = todayKey_();
        }
      }
      var box = document.getElementById('today-list');
      if (!box) return;
      var rows = [];
      (todayEvents || []).forEach(function (ev) {
        var when = ev.isAllDay ? '終日' : String((ev.start || '') + (ev.end ? '–' + ev.end : ''));
        rows.push('<div class="today-row"><b>' + escapeHtml(when) + '</b><span>' + escapeHtml(ev.title || '') + '</span></div>');
      });
      var today = todayKey_();
      var openToday = personalTasks.filter(function (t) {
        return t.status !== 'done' && (t.bucket === 'today' || t.due_date === today);
      });
      openToday.forEach(function (t) {
        rows.push('<div class="today-row"><b>TODO</b><span>' + escapeHtml(t.title) + '</span></div>');
      });
      box.innerHTML = rows.length ? rows.join('') : '<div class="todo-empty" style="padding:8px 0;">本日の予定はありません。</div>';
    }

    function initPersonalTasks() {
      loadPersonalTasksLocal_();
      migrateMemoTodos_();
      var ymd = todayKey_();
      var carried = false;
      personalTasks.forEach(function (t) {
        if (carryPersonalTask_(t, ymd)) {
          carried = true;
          persistPersonalTask_(t);
        }
      });
      if (carried) savePersonalTasksLocal_();
      renderMemoTodos();
      setSyncStatus('…', '');
      fetch('/api/tasks', { cache: 'no-store' })
        .then(function (r) {
          return r.json().then(function (res) {
            return { httpOk: r.ok, res: res };
          });
        })
        .then(function (pack) {
          var res = pack && pack.res;
          if (!res || !res.ok || !Array.isArray(res.tasks)) {
            setSyncStatus('TODO×', 'err');
            return;
          }
          // スプシを正とする。空のときだけローカルを上げる
          var localBackup = personalTasks.slice();
          personalTasks = res.tasks.map(normalizeClientTask_);
          if (!personalTasks.length && localBackup.length) {
            personalTasks = localBackup;
            personalTasks.forEach(function (t) { persistPersonalTask_(t); });
          } else {
            savePersonalTasksLocal_();
          }
          setSyncStatus('SHEET', 'ok');
          applyTodayTodosToGyomu_();
          renderMemoTodos();
        })
        .catch(function () {
          setSyncStatus('TODO×', 'err');
        });
      fetch('/api/context', { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res && res.ok && Array.isArray(res.calendarEvents)) {
            todayEvents = res.calendarEvents;
            renderTodayPanel();
          }
        })
        .catch(function () {});
    }

    function fillDailyDate_() {
      var el = document.getElementById('daily-date');
      if (!el) return;
      try {
        el.textContent = new Date().toLocaleDateString('ja-JP', {
          timeZone: 'Asia/Tokyo',
          year: 'numeric',
          month: 'long',
          day: 'numeric',
          weekday: 'short'
        });
      } catch (e) {
        el.textContent = '';
      }
    }

    function fillMainEditorsFromState_() {
      var gy = document.getElementById('gyomu-main-input');
      var ks = document.getElementById('kansou-main-input');
      if (gy) {
        var raw = '';
        try { raw = localStorage.getItem('ryuta_pro_gyomu_raw') || ''; } catch (e) {}
        if (raw) gy.value = raw;
        else {
          var baseLines = finishedTasks && finishedTasks.length ? finishedTasks : DEFAULT_GYOMU_LINES;
          gy.value = baseLines.join('\n');
        }
      }
      if (ks) ks.value = kansouText || '';
    }

    function syncStateFromMainEditors_() {
      var gy = document.getElementById('gyomu-main-input');
      var ks = document.getElementById('kansou-main-input');
      var gyLines = parseGyomuLines_(gy ? gy.value : '');
      finishedTasks = gyLines;
      activeTasks = [];
      kansouText = ks ? String(ks.value || '').trim() : '';
      try {
        localStorage.setItem('ryuta_pro_kansou', kansouText);
        localStorage.setItem('ryuta_pro_gyomu_raw', gy ? gy.value : '');
      } catch (e) {}
      saveTasks();
    }

    var sheetSaveTimer_ = null;
    function scheduleSheetSave_() {
      clearTimeout(sheetSaveTimer_);
      sheetSaveTimer_ = setTimeout(function () {
        fetch('/api/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            active: activeTasks,
            done: finishedTasks,
            kansou: kansouText,
          }),
        })

    let currentFocused = null;
    function toggleFocus(panelId) {
      const panel = document.getElementById(panelId);
      if (currentFocused === panel) {
        panel.classList.remove('focused-panel');
        currentFocused = null;
      } else {
        if (currentFocused) currentFocused.classList.remove('focused-panel');
        panel.classList.add('focused-panel');

    const cmdOverlay = document.getElementById('cmd-palette-overlay');
    const cmdInput = document.getElementById('cmd-input');
    const cmdList = document.getElementById('cmd-list');
    let filteredApps = apps.slice();
    let selectedIndex = 0;

    function openCmdPalette() {
      cmdOverlay.classList.add('active');
      cmdInput.value = '';
      renderCmdList('');
      cmdInput.focus();
    }
    function closeCmdPalette() {
      cmdOverlay.classList.remove('active');
    }

    function renderCmdList(query) {
      const q = (query || '').toLowerCase();
      filteredApps = apps.filter(function (app) { return app.name.toLowerCase().includes(q); });
      cmdList.innerHTML = '';
      selectedIndex = 0;
      if (filteredApps.length === 0) {
        cmdList.innerHTML = '<div class="px-4 py-3 text-xs text-zinc-600">No results — Enter adds task</div>';
        return;
      }
      filteredApps.forEach(function (app, index) {
        const div = document.createElement('div');
        div.className = 'cmd-item' + (index === 0 ? ' selected' : '');
        div.innerHTML = '<span>' + escapeHtml(app.name) + '</span><span class="text-[10px] text-zinc-600 font-mono">Open</span>';
        div.onmouseover = function () {
          document.querySelectorAll('.cmd-item').forEach(function (el) { el.classList.remove('selected'); });
          div.classList.add('selected');
          selectedIndex = index;
        };
        div.onclick = function () { executeCmd(); };
        cmdList.appendChild(div);
      });
    }

    function executeCmd() {
      if (filteredApps.length > 0) {
        const a = document.createElement('a');
        a.href = filteredApps[selectedIndex].url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      } else if (cmdInput.value.trim() !== '') {
        processInputWithoutAI(cmdInput.value);
      }
      closeCmdPalette();
    }

    cmdInput.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeCmdPalette();
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        selectedIndex = (selectedIndex + 1) % Math.max(filteredApps.length, 1);
        updateCmdSelection();
      }
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        selectedIndex = (selectedIndex - 1 + Math.max(filteredApps.length, 1)) % Math.max(filteredApps.length, 1);
        updateCmdSelection();
      }
      if (e.key === 'Enter') {
        e.preventDefault();
        executeCmd();
      }
    });
    cmdInput.addEventListener('input', function (e) {
      renderCmdList(e.target.value);
    });

    function updateCmdSelection() {
      const items = document.querySelectorAll('.cmd-item');
      items.forEach(function (item, index) {
        if (index === selectedIndex) {
          item.classList.add('selected');
          item.scrollIntoView({ block: 'nearest' });
        } else item.classList.remove('selected');
      });
    }

    document.addEventListener('keydown', function (e) {
      var reportOv = document.getElementById('report-preview-modal-overlay');
      if (reportOv && reportOv.classList.contains('active') && e.key === 'Escape') {
        closeReportPreviewModal();
        return;
      }
      var kansouOv = document.getElementById('kansou-modal-overlay');
      if (kansouOv && kansouOv.classList.contains('active') && e.key === 'Escape') {
        closeKansouModal();
        return;
      }
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        openCmdPalette();
        return;
      }
      if (cmdOverlay.classList.contains('active')) return;
      if (e.key === 'Escape' && currentFocused) {
        toggleFocus(currentFocused.id);
        return;
      }
      const tag = document.activeElement.tagName.toLowerCase();
      if (tag === 'input' || tag === 'textarea' || document.activeElement.isContentEditable) return;
      const openTab = function (url) {
        const a = document.createElement('a');
        a.href = url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      };
      const k = e.key.toLowerCase();
      const target = apps.find(function (app) { return app.key === k; });
      if (target && target.url) openTab(target.url);
    });

    function loadOpsPartners_() {
      var defaults = OPS_COMPANIES.map(function (name) {
        return { name: name, emails: '', label: name };
      });
      try {
        var raw = JSON.parse(localStorage.getItem(OPS_PARTNER_KEY) || '[]');
        if (!Array.isArray(raw) || !raw.length) return defaults;
        var map = {};
        raw.forEach(function (p) { if (p && p.name) map[p.name] = p; });
        return defaults.map(function (d) {
          return map[d.name] ? Object.assign({}, d, map[d.name]) : d;
        }).concat(raw.filter(function (p) {
          return p && p.name && OPS_COMPANIES.indexOf(p.name) === -1;
        }));
      } catch (e) {
        return defaults;
      }

        );
      }).join('');
      wrap.querySelectorAll('[data-partner-field]').forEach(function (el) {
        el.addEventListener('input', function () {
          var i = Number(el.getAttribute('data-idx'));
          var field = el.getAttribute('data-partner-field');
          if (!opsPartners[i]) return;
          opsPartners[i][field] = el.value;
          saveOpsPartners_();
        });
      });
    }

    function importPartnerMails(idx) {
      var partner = opsPartners[idx];
      if (!partner) return;
      var status = document.getElementById('ops-partner-status-' + idx);
      if (status) status.textContent = 'Gmail から取得中…';
      var url = '/api/partner-mails?emails=' + encodeURIComponent(partner.emails || '') + '&label=' + encodeURIComponent(partner.label || '');
      fetch(url)
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (!data || !data.ok) {
            if (status) status.textContent = (data && data.message) || '取得に失敗しました';
            return;
          }
          var added = 0;
          (data.items || []).forEach(function (mail) {
            var exists = opsItems.some(function (item) { return item.mailUrl === mail.url; });
            if (exists) return;
            opsItems.unshift({
              id: Date.now() + added,
              kind: opsTab,
              title: mail.subject || '(件名なし)',
              company: partner.name,
              amount: '',
              replyDate: mail.date || '',
              mailUrl: mail.url || '',
              productUrl: '',
              stuckAt: mail.from || '',
              status: 'メール送信済',
              createdAt: new Date().toISOString().slice(0, 10),
            });
            added += 1;
          });
          saveOpsItems_();
          if (status) status.textContent = added ? added + '件を取り込みました' : '新しいメールはありません';
        })
        .catch(function (err) {
          if (status) status.textContent = String(err && err.message ? err.message : err);
        });
    }

    function renderOpsCompanyChips() {
      var wrap = document.getElementById('ops-company-chips');
      if (!wrap) return;
      var current = val_('ops-company-input');
      wrap.innerHTML = OPS_COMPANIES.map(function (name) {
        var active = current === name ? ' active' : '';
        return '<button type="button" class="ops-chip' + active + '" onclick="selectOpsCompany(\'' + name.replace(/'/g, "\\'") + '\')">' + escapeHtml(name) + '</button>';
      }).join('');
    }

    function selectOpsCompany(name) {
      var input = document.getElementById('ops-company-input');
      if (input) input.value = name;
      renderOpsCompanyChips();
      scheduleOpsAutosave();
    }

    function setOpsField_(id, value) {
      var el = document.getElementById(id);
      if (el) el.value = value == null ? '' : String(value);
    }

    function editOpsItem(id) {
      var item = null;
      for (var i = 0; i < opsItems.length; i++) {
        if (opsItems[i].id === id) {
          item = opsItems[i];
          break;
        }
      }
      if (!item) return;
      opsEditId = id;
      setOpsField_('ops-title-input', item.title);
      setOpsField_('ops-company-input', item.company);
      setOpsField_('ops-amount-input', item.amount);
      setOpsField_('ops-reply-input', item.replyDate);
      setOpsField_('ops-mail-input', item.mailUrl);
      setOpsField_('ops-product-input', item.productUrl);
      setOpsField_('ops-stuck-input', item.stuckAt);
      setOpsField_('ops-status-input', item.status || '未着手');
      setOpsSubmitLabel_();
      switchOpsPage('add');
    }

    function addOpsItem(event) {
      if (event) event.preventDefault();
      autosaveOpsNow_();
      if (!val_('ops-title-input')) return;
      clearOpsForm_();
      switchOpsPage('view');
    }

    function cycleOpsStatus(id) {
      for (var i = 0; i < opsItems.length; i++) {
        if (opsItems[i].id === id) {
          var idx = OPS_STATUSES.indexOf(opsItems[i].status);
          opsItems[i].status = OPS_STATUSES[(idx + 1) % OPS_STATUSES.length];
          break;
        }
      }
      saveOpsItems_();
      renderOpsList();
    }

    function removeOpsItem(id) {
      opsItems = opsItems.filter(function (item) { return item.id !== id; });
      saveOpsItems_();
      renderOpsList();
    }

    function opsLink_(url, label) {
      if (!url) return '';
      return '<a href="' + escapeHtml(url) + '" target="_blank" rel="noopener noreferrer">' + label + '</a>';
    }

    function renderOpsList() {
      var list = document.getElementById('ops-list');
      if (!list) return;
      var filtered = opsItems.filter(function (item) {
        if (item.kind !== opsTab) return false;
        if (opsFilterCompany && item.company !== opsFilterCompany) return false;
        return true;
      });
      if (!filtered.length) {
        list.innerHTML =
          '<div class="ops-empty">' +
          (opsTab === 'ringi' ? '稟議申請はまだありません' : '修繕・備品はまだありません') +
          '<div class="mt-3"><button type="button" class="ops-page-tab active" style="width:auto;display:inline-block;padding:8px 14px;" onclick="switchOpsPage(\'add\')">追加する</button></div>' +
          '</div>';
        return;
      }
      list.innerHTML = filtered.map(function (item) {
        var lines = '';
        if (item.company) lines += '<div class="ops-row"><b>会社</b> ' + escapeHtml(item.company) + '</div>';
        if (item.amount) lines += '<div class="ops-row"><b>金額</b> ¥' + escapeHtml(String(item.amount)) + '</div>';
        if (item.replyDate) lines += '<div class="ops-row"><b>返答</b> ' + escapeHtml(item.replyDate) + '</div>';
        if (item.stuckAt) lines += '<div class="ops-row"><b>停止</b> ' + escapeHtml(item.stuckAt) + '</div>';
        var links = opsLink_(item.mailUrl, 'メール') + opsLink_(item.productUrl, '商品');
        return (
          '<div class="ops-card" onclick="editOpsItem(' + item.id + ')">' +
            '<div class="ops-card-top">' +
              '<div class="min-w-0">' +
                '<div class="ops-title">' + escapeHtml(item.title) + '</div>' +
              '</div>' +
              '<button type="button" class="ops-status" onclick="event.stopPropagation(); cycleOpsStatus(' + item.id + ')">' +
                escapeHtml(item.status || '未着手') +
              '</button>' +
            '</div>' +
            lines +
            (links ? '<div class="ops-links" onclick="event.stopPropagation()">' + links + '</div>' : '') +
            '<button type="button" onclick="event.stopPropagation(); removeOpsItem(' + item.id + ')" class="text-[10px] text-zinc-500 hover:text-zinc-300 mt-2">削除</button>' +
          '</div>'
        );
      }).join('');
    }

    window.onload = function () {
      renderAppLinks();
      initPersonalTasks();
      loadDataFromGAS();
      loadFromSheet();
      renderTasks();
      fillDailyDate_();
      fillMainEditorsFromState_();
      applyTodayTodosToGyomu_();
      setupAiMascotClick();
      setupAppsViewSwitch();
      setupTaxMascot();
      if (document.getElementById('ops-tab-ringi')) switchOpsTab('ringi');
      renderOpsFilterChips();
      setSyncStatus(typeof google !== 'undefined' && google.script ? '…' : 'LOCAL', '');
      setTimeout(randomMascotAction, 2200);
      var mainKansou = document.getElementById('kansou-main-input');
      if (mainKansou) mainKansou.focus();
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(function () {});
      }
      ['gyomu-main-input', 'kansou-main-input'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.addEventListener('input', autosaveDailyNow_);
      });
      var todoAdd = document.getElementById('todo-add-btn');
      var todoInput = document.getElementById('todo-input');
      if (todoAdd) todoAdd.addEventListener('click', addMemoTodo);
      if (todoInput) todoInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          addMemoTodo();
        }
      });
      var todoBuckets = document.getElementById('todo-buckets');
      if (todoBuckets) {
        todoBuckets.addEventListener('click', function (e) {
          var btn = e.target && e.target.closest ? e.target.closest('[data-bucket]') : null;
          if (!btn) return;
          todoBucket = btn.getAttribute('data-bucket') || 'today';
          todoEditId = '';
          renderMemoTodos();
        });
      }
      var todoList = document.getElementById('todo-list');
      if (todoList) {
        todoList.addEventListener('change', function (e) {
          var el = e.target;
          if (!el || !el.getAttribute) return;
          if (el.getAttribute('data-todo')) {
            toggleMemoTodo(el.getAttribute('data-todo'), el.checked);
            return;
          }
          if (el.getAttribute('data-field') && el.getAttribute('data-id')) {
            updatePersonalField_(el.getAttribute('data-id'), el.getAttribute('data-field'), el.value);
          }
        });
        todoList.addEventListener('input', function (e) {
          var el = e.target;
          if (!el || !el.getAttribute || !el.getAttribute('data-field')) return;
          var field = el.getAttribute('data-field');
          if (field !== 'title' && field !== 'url') return;
          var t = findPersonalTask_(el.getAttribute('data-id'));
          if (!t) return;
          if (field === 'title') {
            var next = String(el.value || '').trim();
            if (!next) return;
            t.title = next;
          } else {
            t.url = String(el.value || '').trim();
          }
          persistPersonalTask_(t);
        });
        todoList.addEventListener('click', function (e) {
          var del = e.target && e.target.closest ? e.target.closest('[data-del]') : null;
          if (del) {
            e.preventDefault();
            removeMemoTodo(del.getAttribute('data-del'));
            return;
          }
          var edit = e.target && e.target.closest ? e.target.closest('[data-edit]') : null;
          if (edit) {
            var id = edit.getAttribute('data-edit');
            todoEditId = todoEditId === id ? '' : id;
            renderMemoTodos();
          }
        });
      }
      ['ops-title-input', 'ops-company-input', 'ops-amount-input', 'ops-reply-input', 'ops-mail-input', 'ops-product-input', 'ops-stuck-input', 'ops-status-input'].forEach(function (id) {
        var el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('input', scheduleOpsAutosave);
        el.addEventListener('change', scheduleOpsAutosave);
      });
      window.addEventListener('pagehide', function () {
        autosaveDailyNow_();
        autosaveOpsNow_();
      });
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') {
          autosaveDailyNow_();
          autosaveOpsNow_();
        }
      });
    };
  </script>
</body>
</html>
